name: Deploy to Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  BACKEND_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/cosmicforge-backend
  AI_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/cosmicforge-ai

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:latest
            ${{ env.BACKEND_IMAGE }}:prod-${{ github.sha }}
          cache-from: type=registry,ref=${{ env.BACKEND_IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.BACKEND_IMAGE }}:buildcache,mode=max

      - name: Build and push AI service image
        uses: docker/build-push-action@v5
        with:
          context: ./ai_service
          file: ./ai_service/Dockerfile
          push: true
          tags: |
            ${{ env.AI_IMAGE }}:latest
            ${{ env.AI_IMAGE }}:prod-${{ github.sha }}
          cache-from: type=registry,ref=${{ env.AI_IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.AI_IMAGE }}:buildcache,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Deploy to Production VPS
        uses: appleboy/ssh-action@master
        env:
          PROD_ENV_FILE: ${{ secrets.PROD_ENV_FILE }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          envs: PROD_ENV_FILE
          script: |
            set -e # Exit immediately if any command fails

            # Ensure directory exists
            mkdir -p /root/cosmic-production
            cd /root/cosmic-production || exit 1

            echo "Synchronizing infrastructure code..."
            git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
            git fetch origin
            git reset --hard origin/main

            echo "Configuring environment..."
            echo "$PROD_ENV_FILE" > .env.production

            echo "Pulling latest images..."
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/cosmicforge-backend:latest
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/cosmicforge-ai:latest
            docker pull redis:alpine
            docker pull nginx:alpine

            echo "Aggressively cleaning up old containers..."
            # 1. Stop host-level web servers
            systemctl stop nginx apache2 2>/dev/null || true

            # 2. Clear Port 80 and 443
            echo "Clearing Port 80 and 443..."
            fuser -k 80/tcp 2>/dev/null || true
            fuser -k 443/tcp 2>/dev/null || true

            # 2.5 Docker-level Port Clear (Targets ANY container on Port 80/443)
            echo "Removing ANY Docker containers on Port 80/443..."
            IDS_80=$(docker ps -a -q --filter "publish=80")
            if [ -n "$IDS_80" ]; then docker rm -f $IDS_80 || true; fi
            IDS_443=$(docker ps -a -q --filter "publish=443")
            if [ -n "$IDS_443" ]; then docker rm -f $IDS_443 || true; fi

            # 3. Destroy ANY container matching our names by ID (Fixes Ghost Containers)
            echo "Identifying and destroying cosmic containers by ID..."
            for name in cosmic_gateway_prod cosmic_backend_prod cosmic_brain_prod cosmic_redis_prod; do
                IDs=$(docker ps -a -q --filter "name=$name")
                for ID in $IDs; do
                    echo "Destroying $name (ID: $ID)..."
                    PID=$(docker inspect --format '{{.State.Pid}}' $ID 2>/dev/null || echo "0")
                    if [ -n "$PID" ] && [ "$PID" -gt 0 ] 2>/dev/null; then
                        echo "Killing process $PID..."
                        kill -9 $PID || true
                    fi
                    docker rm -f $ID || true
                done
            done

            # 4. Final Port Check
            echo "Checking if Port 80 is free..."
            netstat -tulpn | grep :80 || echo "Port 80 is FREE"

            echo "Setting up Network..."
            docker network create cosmic_network_prod 2>/dev/null || true

            echo "Starting Redis..."
            docker run -d \
              --name cosmic_redis_prod \
              --network cosmic_network_prod \
              --restart unless-stopped \
              redis:alpine

            echo "Starting AI Service..."
            docker run -d \
              --name cosmic_brain_prod \
              --network cosmic_network_prod \
              --restart unless-stopped \
              ${{ secrets.DOCKERHUB_USERNAME }}/cosmicforge-ai:latest
              
            echo "Starting Backend Service..."
            docker run -d \
              --name cosmic_backend_prod \
              --network cosmic_network_prod \
              --restart unless-stopped \
              --env-file .env.production \
              -e REDIS_URL=redis://cosmic_redis_prod:6379 \
              -e REDIS_DEV_HOST=cosmic_redis_prod \
              -e AI_SERVICE_URL=http://cosmic_brain_prod:8001/api/v1 \
              -e FILE_SERVER_URL=https://api.cosmicforge-healthnet.com \
              -v $(pwd)/uploads:/app/uploads \
              ${{ secrets.DOCKERHUB_USERNAME }}/cosmicforge-backend:latest
              
            echo "Starting Nginx Gateway..."
            mkdir -p certbot
            docker run -d \
              --name cosmic_gateway_prod \
              --network cosmic_network_prod \
              --restart unless-stopped \
              -p 80:80 -p 443:443 \
              -v $(pwd)/deployment/nginx.production.conf:/etc/nginx/nginx.conf:ro \
              -v $(pwd)/uploads:/app/uploads:ro \
              -v /etc/letsencrypt:/etc/letsencrypt:ro \
              -v $(pwd)/certbot:/var/www/certbot:ro \
              nginx:alpine

            echo "Cleaning up..."
            docker image prune -f

            echo "Verifying containers..."
            sleep 5
            docker ps --filter "name=cosmic_*_prod"

            echo "Deployment Complete!"
