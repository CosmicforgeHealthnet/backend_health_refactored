name: Deploy to Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  BACKEND_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/cosmicforge-backend
  AI_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/cosmicforge-ai

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:latest
            ${{ env.BACKEND_IMAGE }}:prod-${{ github.sha }}
          cache-from: type=registry,ref=${{ env.BACKEND_IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.BACKEND_IMAGE }}:buildcache,mode=max

      - name: Build and push AI service image
        uses: docker/build-push-action@v5
        with:
          context: ./ai_service
          file: ./ai_service/Dockerfile
          push: true
          tags: |
            ${{ env.AI_IMAGE }}:latest
            ${{ env.AI_IMAGE }}:prod-${{ github.sha }}
          cache-from: type=registry,ref=${{ env.AI_IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.AI_IMAGE }}:buildcache,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Deploy to Production VPS
        uses: appleboy/ssh-action@master
        env:
          PROD_ENV_FILE: ${{ secrets.PROD_ENV_FILE }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          envs: PROD_ENV_FILE
          script: |
            set -e

            # Ensure working directory
            DEPLOY_PATH="/root/cosmic-production"
            mkdir -p $DEPLOY_PATH
            cd $DEPLOY_PATH || exit 1

            echo "Syncing code..."
            git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
            git fetch origin
            git reset --hard origin/main

            echo "Setting environment..."
            echo "# Updated at: $(date)" > .env.production
            echo "$PROD_ENV_FILE" >> .env.production
            cp .env.production .env

            echo "--- Environment File Verification ---"
            echo "Deployment path: $(pwd)"
            echo "Files in directory:"
            ls -la .env*
            echo "First line of .env:"
            head -n 1 .env
            echo "MD5 of .env (for verification):"
            md5sum .env
            echo "------------------------------------"

            echo "Logging into Docker Hub..."
            echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

            echo "Pulling images..."
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/cosmicforge-backend:latest
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/cosmicforge-ai:latest
            docker pull redis:alpine
            docker pull nginx:alpine

            echo "Cleanup phase started..."
            systemctl stop nginx apache2 2>/dev/null || true
            for port in 80 443 5000; do
                fuser -k ${port}/tcp 2>/dev/null || true
            done

            echo "Restarting Docker daemon to clear stale port bindings..."
            systemctl restart docker
            sleep 5

            echo "Removing production containers..."
            for name in cosmic_gateway_prod cosmic_backend_prod cosmic_brain_prod cosmic_redis_prod; do
                docker network disconnect -f cosmic_network_prod $name 2>/dev/null || true
                docker update --restart=no $name 2>/dev/null || true
                docker stop -t 10 $name 2>/dev/null || true
                docker rm -f $name 2>/dev/null || \
                    docker rename $name "${name}_dead_$(date +%s)" 2>/dev/null || true
            done
            docker network rm cosmic_network_prod 2>/dev/null || true
            echo "Containers cleared."

            echo "Starting network..."
            docker network create cosmic_network_prod 2>/dev/null || true

            echo "Starting Redis..."
            docker run -d \
              --name cosmic_redis_prod \
              --network cosmic_network_prod \
              --restart unless-stopped \
              --network-alias redis \
              redis:alpine

            echo "Starting AI..."
            docker run -d \
              --name cosmic_brain_prod \
              --network cosmic_network_prod \
              --restart unless-stopped \
              --env-file .env.production \
              ${{ secrets.DOCKERHUB_USERNAME }}/cosmicforge-ai:latest
              
            echo "Starting Backend..."
            docker run -d \
              --name cosmic_backend_prod \
              --network cosmic_network_prod \
              --restart unless-stopped \
               --env-file .env.production \
               -e NODE_ENV=production \
               -e PORT=5000 \
               -p 5000:5000 \
               -v $DEPLOY_PATH/uploads:/app/uploads \
               ${{ secrets.DOCKERHUB_USERNAME }}/cosmicforge-backend:latest
              
            echo "Starting Gateway..."
            mkdir -p $DEPLOY_PATH/certbot
            docker run -d \
              --name cosmic_gateway_prod \
              --network cosmic_network_prod \
              --restart unless-stopped \
              -p 80:80 -p 443:443 \
              -v $DEPLOY_PATH/deployment/nginx.production.conf:/etc/nginx/nginx.conf:ro \
              -v $DEPLOY_PATH/uploads:/app/uploads:ro \
              -v /etc/letsencrypt:/etc/letsencrypt:ro \
              -v $DEPLOY_PATH/certbot:/var/www/certbot:ro \
              nginx:alpine

            # Connect gateway to any app networks it may need to proxy.
            for NETWORK in cosmic_network_dev cosmic_lab_network_staging cosmic_lab_network_prod; do
                if docker network inspect "$NETWORK" >/dev/null 2>&1; then
                    echo "Connecting production gateway to $NETWORK..."
                    docker network connect "$NETWORK" cosmic_gateway_prod 2>/dev/null || true
                else
                    echo "⚠️ Skip connecting to $NETWORK (network not found)"
                fi
            done

            echo "Cleaning images..."
            docker image prune -f

            echo "Deployment finished. Waiting for backend to become healthy..."
            for i in {1..12}; do
              if curl -s -k --connect-timeout 5 --max-time 10 https://api.cosmicforge-healthnet.com/health | grep -q "version"; then
                echo "✅ Backend is LIVE and healthy! The deployment is successful."
                docker ps --filter "name=cosmic_*_prod"
                exit 0
              fi
              echo "Waiting for backend... attempt $i/12"
              echo "Gateway status:"
              docker ps --filter "name=cosmic_gateway_prod"
              echo "Production backend status:"
              docker ps --filter "name=cosmic_backend_prod"
              sleep 10
            done

            echo "❌ Backend failed to start or is not accessible!"
            docker ps -a --filter "name=cosmic_"
            echo "--- Gateway Logs ---"
            docker logs cosmic_gateway_prod --tail 50
            echo "--- Backend Logs ---"
            docker logs cosmic_backend_prod --tail 100
            exit 1
