name: Deploy to Development

on:
    push:
        branches:
            - dev
    workflow_dispatch:

env:
    BACKEND_IMAGE: cosmicforge/cosmicforge-backend
    AI_IMAGE: cosmicforge/cosmicforge-ai

jobs:
    build-and-push:
        runs-on: ubuntu-latest
        environment: development

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Log in to Docker Hub
              uses: docker/login-action@v3
              with:
                  username: ${{ secrets.DOCKERHUB_USERNAME }}
                  password: ${{ secrets.DOCKERHUB_TOKEN }}

            - name: Build and push backend image
              uses: docker/build-push-action@v5
              with:
                  context: .
                  file: ./Dockerfile
                  push: true
                  tags: |
                      ${{ env.BACKEND_IMAGE }}:dev-latest
                      ${{ env.BACKEND_IMAGE }}:dev-${{ github.sha }}
                  cache-from: type=registry,ref=${{ env.BACKEND_IMAGE }}:buildcache
                  cache-to: type=registry,ref=${{ env.BACKEND_IMAGE }}:buildcache,mode=max

            - name: Build and push AI service image
              uses: docker/build-push-action@v5
              with:
                  context: ./ai_service
                  file: ./ai_service/Dockerfile
                  push: true
                  tags: |
                      ${{ env.AI_IMAGE }}:dev-latest
                      ${{ env.AI_IMAGE }}:dev-${{ github.sha }}
                  cache-from: type=registry,ref=${{ env.AI_IMAGE }}:buildcache
                  cache-to: type=registry,ref=${{ env.AI_IMAGE }}:buildcache,mode=max

    deploy:
        needs: build-and-push
        runs-on: ubuntu-latest
        environment: development

        steps:
            - name: Deploy to Development VPS
              uses: appleboy/ssh-action@master
              with:
                  host: ${{ secrets.VPS_HOST }}
                  username: ${{ secrets.VPS_USERNAME }}
                  key: ${{ secrets.VPS_SSH_KEY }}
                  port: ${{ secrets.VPS_PORT || 22 }}
                  script: |
                      # Ensure the directory exists
                      mkdir -p /var/www/cosmic-dev
                      cd /var/www/cosmic-dev || exit 1

                      echo "📦 Synchronizing infrastructure code..."
                      if [ ! -d ".git" ]; then
                        git init
                        git remote add origin https://github.com/${{ github.repository }}.git
                      fi

                      git fetch origin
                      git reset --hard origin/dev

                      echo "📝 Configuring environment..."
                      # Create .env.dev from GitHub Secrets
                      echo "${{ secrets.DEV_ENV_FILE }}" > .env.dev

                      echo "🐳 Pulling latest images..."
                      docker pull cosmicforge/cosmicforge-backend:dev-latest
                      docker pull cosmicforge/cosmicforge-ai:dev-latest
                      docker pull redis:alpine
                      docker pull nginx:alpine

                      echo "🛑 Removing old containers..."
                      docker rm -f cosmic_gateway_dev cosmic_backend_dev cosmic_brain_dev cosmic_redis_dev || true

                      echo "🌐 Setting up Network..."
                      docker network create cosmic_network_dev || true

                      echo "🚀 Starting Redis..."
                      # Redis on dev port 6380:6379
                      docker run -d \
                        --name cosmic_redis_dev \
                        --network cosmic_network_dev \
                        --restart unless-stopped \
                        -p 6380:6379 \
                        redis:alpine

                      echo "🚀 Starting AI Service..."
                      # AI on dev port 8002:8001
                      docker run -d \
                        --name cosmic_brain_dev \
                        --network cosmic_network_dev \
                        --restart unless-stopped \
                        -p 8002:8001 \
                        cosmicforge/cosmicforge-ai:dev-latest
                        
                      echo "🚀 Starting Backend Service..."
                      # Backend on dev port 5001:5000
                      docker run -d \
                        --name cosmic_backend_dev \
                        --network cosmic_network_dev \
                        --restart unless-stopped \
                        --env-file .env.dev \
                        -e REDIS_URL=redis://cosmic_redis_dev:6379 \
                        -e REDIS_DEV_HOST=cosmic_redis_dev \
                        -e AI_SERVICE_URL=http://cosmic_brain_dev:8001/api/v1 \
                        -p 5001:5000 \
                        -v $(pwd)/uploads:/app/uploads \
                        cosmicforge/cosmicforge-backend:dev-latest
                        
                      echo "🚀 Starting Nginx Gateway..."
                      # Nginx on dev port 8081:80
                      docker run -d \
                        --name cosmic_gateway_dev \
                        --network cosmic_network_dev \
                        --restart unless-stopped \
                        -p 8081:80 \
                        -v $(pwd)/deployment/nginx.dev.conf:/etc/nginx/nginx.conf:ro \
                        -v $(pwd)/uploads:/app/uploads:ro \
                        nginx:alpine

                      echo "🧹 Cleaning up..."
                      docker image prune -f

                      echo "✅ Development deployment completed!"
                      docker ps --filter "name=cosmic_*_dev" --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"
