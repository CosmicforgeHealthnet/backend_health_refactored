name: Deploy to Development

on:
  push:
    branches:
      - dev
  workflow_dispatch:

env:
  BACKEND_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/cosmicforge-backend
  AI_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/cosmicforge-ai

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    environment: development

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:dev-latest
            ${{ env.BACKEND_IMAGE }}:dev-${{ github.sha }}
          cache-from: type=registry,ref=${{ env.BACKEND_IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.BACKEND_IMAGE }}:buildcache,mode=max

      - name: Build and push AI service image
        uses: docker/build-push-action@v5
        with:
          context: ./ai_service
          file: ./ai_service/Dockerfile
          push: true
          tags: |
            ${{ env.AI_IMAGE }}:dev-latest
            ${{ env.AI_IMAGE }}:dev-${{ github.sha }}
          cache-from: type=registry,ref=${{ env.AI_IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.AI_IMAGE }}:buildcache,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: development

    steps:
      - name: Deploy to Development VPS
        uses: appleboy/ssh-action@master
        env:
          DEV_ENV_FILE: ${{ secrets.DEV_ENV_FILE }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          envs: DEV_ENV_FILE
          script: |
            set -e
            # Ensure directory exists
            mkdir -p /root/cosmic-dev
            cd /root/cosmic-dev || exit 1

            echo "Synchronizing infrastructure code..."
            if [ ! -d ".git" ]; then
              git init
              git remote add origin https://github.com/${{ github.repository }}.git
            fi
            git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
            git fetch origin
            git reset --hard origin/dev

            echo "Configuring environment..."
            # Create .env.dev from environment variable for reliability
            echo "# Updated at: $(date)" > .env.dev
            echo "$DEV_ENV_FILE" >> .env.dev
            cp .env.dev .env

            echo "--- Environment File Verification (Dev) ---"
            echo "Deployment path: $(pwd)"
            echo "Files in directory:"
            ls -la .env*
            echo "First line of .env:"
            head -n 1 .env
            echo "MD5 of .env (for verification):"
            md5sum .env
            echo "------------------------------------------"

            echo "Pulling latest images from Registry..."
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/cosmicforge-backend:dev-latest
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/cosmicforge-ai:dev-latest
            docker pull redis:alpine
            docker pull nginx:alpine

            echo "Aggressively cleaning up old containers..."
            # 1. Stop host-level web servers that might be hogging ports
            systemctl stop nginx apache2 2>/dev/null || true

            # 2. Clear all ports used by this deployment
            for port in 80 443 6380 5001 8002 8081; do
                fuser -k ${port}/tcp 2>/dev/null || true
            done

            # 3. Destroy ALL cosmic containers (including any previously renamed dead ones)
            echo "Stopping and removing all cosmic containers..."
            docker ps -aq --filter "name=cosmic_" | xargs -r docker update --restart=no 2>/dev/null || true
            docker ps -aq --filter "name=cosmic_" | xargs -r docker stop -t 15 2>/dev/null || true
            docker ps -aq --filter "name=cosmic_" | xargs -r docker rm -f 2>/dev/null || true
            echo "Containers cleared."

            echo "Setting up Network..."
            docker network create cosmic_network_dev 2>/dev/null || true

            echo "Starting Redis..."
            # Redis on dev port 6380:6379
            docker run -d \
              --name cosmic_redis_dev \
              --network cosmic_network_dev \
              --restart unless-stopped \
              --network-alias redis \
              -p 6380:6379 \
              redis:alpine

            echo "Starting AI Service..."
            # AI on dev port 8002:8001
            docker run -d \
              --name cosmic_brain_dev \
              --network cosmic_network_dev \
              --restart unless-stopped \
              --env-file .env.dev \
              -p 8002:8001 \
              ${{ secrets.DOCKERHUB_USERNAME }}/cosmicforge-ai:dev-latest

            echo "Starting Backend Service..."
            # Backend on dev port 5001:5000
            docker run -d \
              --name cosmic_backend_dev \
              --network cosmic_network_dev \
              --restart unless-stopped \
               --env-file .env.dev \
               -e NODE_ENV=development \
               -e PORT=5000 \
               -p 5001:5000 \
               -v $(pwd)/uploads:/app/uploads \
               ${{ secrets.DOCKERHUB_USERNAME }}/cosmicforge-backend:dev-latest \
               npm run dev

            echo "Starting Nginx Gateway..."
            # Nginx on dev port 8081:80
            docker run -d \
              --name cosmic_gateway_dev \
              --network cosmic_network_dev \
              --restart unless-stopped \
              -p 8081:80 \
              -v $(pwd)/deployment/nginx.dev.conf:/etc/nginx/nginx.conf:ro \
              -v $(pwd)/uploads:/app/uploads:ro \
              nginx:alpine

            echo "Cleaning up..."
            docker image prune -f

            echo "Development deployment completed! Waiting for backend to become healthy..."
            for i in {1..12}; do
              if curl -s -k --connect-timeout 5 --max-time 10 https://dev-api.cosmicforge-healthnet.com/health | grep -q "version"; then
                echo "✅ Dev Backend is LIVE and healthy! The deployment is successful."
                docker ps --filter "name=cosmic_" --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"
                exit 0
              fi
              echo "Waiting for dev backend... attempt $i/12"
              echo "Current container status:"
              docker ps -a --filter "name=cosmic_" --format "table {{.Names}}\t{{.Status}}"
              echo "Recent logs for cosmic_backend_dev:"
              docker logs --tail 20 cosmic_backend_dev || echo "Could not get logs for cosmic_backend_dev"
              sleep 10
            done

            echo "❌ Dev Backend failed to start or is not accessible!"
            docker ps -a --filter "name=cosmic_"
            docker logs cosmic_backend_dev --tail 100
            exit 1
