          in: query
          required: true
          description: Authorization code from Google
          schema:
            type: string
        - name: state
          in: query
          required: true
          description: State parameter (contains doctor ID)
          schema:
            type: string
        - name: error
          in: query
          description: Error parameter if authorization failed
          schema:
            type: string
      responses:
        '302':
          description: Redirect to dashboard with status
          headers:
            Location:
              description: Dashboard URL with auth status
              schema:
                type: string
                example: "/dashboard?google_auth=success"

