# =============================================================================
# docs/mfa/mfa.yaml - MFA PATHS
# =============================================================================
paths:
  /auth/mfa/status:
    get:
      summary: Get MFA status for current user
      description: Check if the authenticated user has two-factor authentication enabled
      tags: [Multi-Factor Authentication]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: MFA status retrieved successfully
          content:
            application/json:
              schema:
                $ref: './mfaComponents.yaml#/components/schemas/MFAStatusResponse'
              examples:
                mfa_enabled:
                  summary: User has MFA enabled
                  value:
                    mfaEnabled: true
                    message: "MFA is enabled"
                mfa_disabled:
                  summary: User has MFA disabled
                  value:
                    mfaEnabled: false
                    message: "MFA is disabled"
        '401':
          $ref: './mfaComponents.yaml#/components/responses/MFAUnauthorized'

  /auth/mfa/setup:
    post:
      summary: Generate MFA setup data (QR code and secret)
      description: |
        Generates a new TOTP secret and QR code for setting up two-factor authentication.
        
        **Response includes:**
        - QR code as data URL for easy scanning
        - Manual entry key for manual setup
        - Secret for verification
        - Backup codes for account recovery
        
        **Important:** Save the backup codes securely before enabling MFA!
      tags: [Multi-Factor Authentication]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: MFA setup data generated successfully
          content:
            application/json:
              schema:
                $ref: './mfaComponents.yaml#/components/schemas/MFASetupResponse'
              examples:
                setup_success:
                  summary: Successful MFA setup generation
                  value:
                    message: "MFA setup data generated"
                    qrCodeUrl: "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAQAAAAEA..."
                    manualEntryKey: "JBSWY3DPEHPK3PXP"
                    secret: "JBSWY3DPEHPK3PXP"
                    backupCodes: ["ABC12345", "DEF67890", "GHI11223"]
        '400':
          description: MFA already enabled
          content:
            application/json:
              schema:
                $ref: './mfaComponents.yaml#/components/schemas/MFAErrorResponse'
              examples:
                already_enabled:
                  value:
                    error: "Two-factor authentication is already enabled"
        '401':
          $ref: './mfaComponents.yaml#/components/responses/MFAUnauthorized'

  /auth/mfa/enable:
    post:
      summary: Enable MFA with verification code
      description: |
        Enables two-factor authentication after verifying the setup with a test code.
        
        **Steps:**
        1. Call `/auth/mfa/setup` to get QR code and secret
        2. Scan QR code with authenticator app
        3. Generate 6-digit code from app
        4. Call this endpoint with code and secret to enable MFA
        
        **Security:** Once enabled, all future logins will require the 6-digit code.
      tags: [Multi-Factor Authentication]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './mfaComponents.yaml#/components/schemas/MFAEnableRequest'
            examples:
              enable_request:
                summary: Enable MFA with verification
                value:
                  token: "123456"
                  secret: "JBSWY3DPEHPK3PXP"
      responses:
        '200':
          description: MFA enabled successfully
          content:
            application/json:
              schema:
                $ref: './mfaComponents.yaml#/components/schemas/MFASuccessResponse'
              examples:
                enable_success:
                  value:
                    success: true
                    message: "Two-factor authentication enabled successfully"
        '400':
          description: Invalid verification code or MFA already enabled
          content:
            application/json:
              schema:
                $ref: './mfaComponents.yaml#/components/schemas/MFAErrorResponse'
              examples:
                invalid_code:
                  summary: Invalid verification code
                  value:
                    error: "Invalid verification code"
                already_enabled:
                  summary: MFA already enabled
                  value:
                    error: "Two-factor authentication is already enabled"
                missing_fields:
                  summary: Missing required fields
                  value:
                    error: "Verification code and secret are required"
        '401':
          $ref: './mfaComponents.yaml#/components/responses/MFAUnauthorized'

  /auth/mfa/disable:
    post:
      summary: Disable MFA with verification code
      description: |
        Disables two-factor authentication after verifying with current MFA code.
        
        **Security:** Requires current 6-digit code from authenticator app to disable.
        After disabling, future logins will only require email and password.
      tags: [Multi-Factor Authentication]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './mfaComponents.yaml#/components/schemas/MFADisableRequest'
            examples:
              disable_request:
                summary: Disable MFA with current code
                value:
                  token: "654321"
      responses:
        '200':
          description: MFA disabled successfully
          content:
            application/json:
              schema:
                $ref: './mfaComponents.yaml#/components/schemas/MFASuccessResponse'
              examples:
                disable_success:
                  value:
                    success: true
                    message: "Two-factor authentication disabled successfully"
        '400':
          description: Invalid verification code or MFA not enabled
          content:
            application/json:
              schema:
                $ref: './mfaComponents.yaml#/components/schemas/MFAErrorResponse'
              examples:
                invalid_code:
                  summary: Invalid verification code
                  value:
                    error: "Invalid verification code"
                not_enabled:
                  summary: MFA not enabled
                  value:
                    error: "Two-factor authentication is not enabled"
                missing_token:
                  summary: Missing verification code
                  value:
                    error: "Verification code is required"
        '401':
          $ref: './mfaComponents.yaml#/components/responses/MFAUnauthorized'