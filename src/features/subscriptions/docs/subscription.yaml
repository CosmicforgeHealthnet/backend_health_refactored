  /api/subscription/public/plans/{planType}/{tier}:
    get:
      summary: Get specific plan pricing (Public - No Auth Required)
      description: Retrieve detailed pricing for a specific plan. No authentication required.
      tags:
        - Subscription Public
      security: []
      parameters:
        - name: planType
          in: path
          required: true
          schema:
            type: string
            enum: [doctor, patient]
          description: "Type of subscription plan"
          example: "patient"
        - name: tier
          in: path
          required: true
          schema:
            type: string
            enum: [free, basic, standard, medium, premium, professional, gold_elite]
          description: "Plan tier"
          example: "premium"
        - name: countryCode
          in: query
          schema:
            type: string
            pattern: '^[A-Z]{2}$'
            example: "NG"
          description: "ISO 3166-1 alpha-2 country code for currency conversion"
      responses:
        '200':
          description: Plan pricing retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    $ref: '#/components/schemas/PublicPlan'
        '404':
          description: Plan not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionErrorResponse'

