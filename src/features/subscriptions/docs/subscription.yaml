          description: "Type of subscription plan"
          example: "patient"
        - name: tier
          in: path
          required: true
          schema:
            type: string
            enum: [free, basic, standard, medium, premium, professional, gold_elite]
          description: "Plan tier"
          example: "premium"
        - name: countryCode
          in: query
          schema:
            type: string
            pattern: '^[A-Z]{2}$'
            example: "GB"
          description: "ISO 3166-1 alpha-2 country code for currency conversion (defaults to US)"
