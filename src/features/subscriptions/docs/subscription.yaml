  /api/subscription/cancel:
    post:
      summary: Cancel subscription
      tags:
        - Subscription Management
      security:
        - bearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelSubscriptionRequest'
      responses:
        '200':
          description: Subscription cancelled successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CancelSubscriptionResponse'
        '400':
          $ref: '#/components/responses/SubscriptionBadRequest'
        '401':
          $ref: '#/components/responses/SubscriptionUnauthorized'

  /api/subscription/features/{featureName}:
    get:
      summary: Check if user has access to specific feature
      tags:
        - Subscription Management
      security:
        - bearerAuth: []
      parameters:
        - name: featureName
          in: path
          required: true
          schema:
            type: string
          description: "Name of the feature to check"
          example: "videoConsultation"
      responses:
        '200':
          description: Feature access checked successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeatureAccessResponse'
        '401':
          $ref: '#/components/responses/SubscriptionUnauthorized'

  /api/subscription/usage:
    get:
      summary: Get comprehensive usage summary
      description: |
        Returns complete subscription usage data including:
        - Subscription info (tier, status, dates)
        - Usage limits with progress (used/limit/remaining/percentage)
        - Feature access (enabled/disabled features)
        - Family plan details
        - Commission rate (for doctors)
        - Health status and warnings
        - Reset date information
      tags:
        - Subscription Management
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Usage summary retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Usage summary retrieved successfully"
                  data:
                    $ref: '#/components/schemas/ComprehensiveUsageSummary'
              examples:
                premium_patient:
                  summary: Premium patient with unlimited features
                  value:
                    success: true
                    message: "Usage summary retrieved successfully"
                    data:
                      subscription:
                        id: "sub_123"
                        tier: "premium"
                        tierDisplay: "Premium Plan"
                        planType: "patient"
                        status: "active"
                        isActive: true
                        isPremium: true
                        startDate: "2026-01-01T00:00:00Z"
                        endDate: "2026-02-01T00:00:00Z"
                        daysRemaining: 15
                        autoRenew: true
                      usageLimits:
                        aiChatbotResponses:
                          displayName: "AI Chatbot Messages"
                          description: "Monthly AI chatbot interactions"
                          icon: "chat"
                          category: "ai"
                          used: 85
                          limit: -1
                          limitDisplay: "Unlimited"
                          remaining: "Unlimited"
                          percentage: 0
                          isUnlimited: true
                          isBlocked: false
                          status: "ok"
                        aiDiagnosticRequests:
                          displayName: "AI Diagnostic Requests"
