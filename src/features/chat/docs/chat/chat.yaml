openapi: 3.0.3
info:
  title: Chat API
  version: 1.0.0
  description: API for managing chat rooms, messages, and appointment chats in a medical communication system.

components:
  $ref: './api/chatComponent.yaml'

paths:
  /api/chat/rooms:
    get:
      security:
        - BearerAuth: []
      tags:
        - Room Management
      summary: Get user's chat rooms
      description: |
        Retrieve all chat rooms the authenticated user is a participant in, including unread counts and room statistics.

        **WebSocket Integration:**
        - **Event: initial_data**: Sent on WebSocket connection with user's rooms and data.
          ```javascript
          socket.on('initial_data', (data) => {
            console.log('User rooms:', data.rooms);
            console.log('User info:', data.user);
          });
          ```

        **Frontend Example (React Hook):**
        ```typescript
        import { useChat } from './hooks/useChat';
        const { rooms } = useChat(token);
        useEffect(() => {
          // Display rooms in UI
          console.log('Rooms:', rooms);
        }, [rooms]);
        ```
      responses:
        '200':
          description: Successfully retrieved user's rooms
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/RoomWithStats'
              example:
                success: true
                data:
                  - id: "3753b1b4-b57a-4dbb-afbb-16187261a65b"
                    name: "General Discussion"
                    description: "Main group chat"
                    type: "group"
                    isPrivate: false
                    maxParticipants: 50
                    participantCount: 12
                    unreadCount: 3
                    lastMessage:
                      id: "msg123"
                      content: "How are you today?"
                      sender:
                        id: "user456"
                        fullName: "Dr. Smith"
                      createdAt: "2025-06-14T10:30:00Z"
                    createdAt: "2025-06-13T05:44:21Z"
                    updatedAt: "2025-06-14T10:30:00Z"
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '500':
          $ref: '#/components/responses/InternalServerError'

    post:
      security:
        - BearerAuth: []
      tags:
        - Room Management
      summary: Create new chat room
      description: |
        Create a new group chat room with specified settings and automatically join the creator as admin.

        **WebSocket Integration:**
        - **Event: room_joined**: Confirmation of joining the newly created room.
          ```javascript
          socket.on('room_joined', (data) => {
            console.log('Joined room:', data.room);
            console.log('Recent messages:', data.messages);
          });
          ```

        **Frontend Example (API Service):**
        ```typescript
        const chatService = new ChatAPIService('https://api.example.com', token);
        async function createRoom() {
          const roomData = {
            name: "Medical Team Discussion",
            description: "Chat for medical team coordination",
            type: "group",
            isPrivate: false,
            maxParticipants: 25,
            settings: { allowFileSharing: true, messageDeletionAllowed: true },
            metadata: { department: "cardiology" }
          };
          const response = await chatService.createRoom(roomData);
          console.log('Created room:', response.data);
        }
        ```
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRoomRequest'
            example:
              name: "Medical Team Discussion"
              description: "Chat for medical team coordination"
              type: "group"
              isPrivate: false
              maxParticipants: 25
              settings:
                allowFileSharing: true
                messageDeletionAllowed: true
              metadata:
                department: "cardiology"
      responses:
        '201':
          description: Room created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/RoomDetails'
                  message:
                    type: string
              example:
                success: true
                message: "Room created successfully"
                data:
                  id: "3753b1b4-b57a-4dbb-afbb-16187261a65b"
                  name: "Medical Team Discussion"
                  description: "Chat for medical team coordination"
                  type: "group"
                  isPrivate: false
                  maxParticipants: 25
                  participants:
                    - id: "part123"
                      role: "admin"
                      user:
                        id: "user123"
                        fullName: "Dr. Johnson"
                        email: "dr.johnson@hospital.com"
                      joinedAt: "2025-06-14T10:00:00Z"
                  createdBy:
                    id: "user123"
                    fullName: "Dr. Johnson"
                  createdAt: "2025-06-14T10:00:00Z"
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /api/chat/direct:
    post:
      security:
        - BearerAuth: []
      tags:
        - Room Management
      summary: Create direct chat
      description: |
        Create or retrieve an existing direct chat between two users.

        **WebSocket Integration:**
        - **Event: room_joined**: Confirmation of joining the direct chat room.
          ```javascript
          socket.on('room_joined', (data) => {
            console.log('Joined direct chat:', data.room);
          });
          ```

        **Frontend Example (API Service):**
        ```typescript
        const chatService = new ChatAPIService('https://api.example.com', token);
        async function startDirectChat() {
          const response = await chatService.createDirectChat("user456");
          console.log('Direct chat:', response.data);
        }
        ```
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - targetUserId
              properties:
                targetUserId:
                  type: string
                  format: uuid
                  description: ID of the user to chat with
            example:
              targetUserId: "user456"
      responses:
        '201':
          description: Direct chat created or retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/RoomDetails'
                  message:
                    type: string
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /api/chat/rooms/{roomId}:
    get:
      security:
        - BearerAuth: []
      tags:
        - Room Management
      summary: Get room details
      description: |
        Retrieve detailed information about a specific chat room, including participants and settings.

        **WebSocket Integration:**
        - **Event: room_updated**: Notifies when room information is updated.
          ```javascript
          socket.on('room_updated', (data) => {
            console.log('Room updated:', data.roomId);
            console.log('Last message:', data.lastMessage);
          });
          ```

        **Frontend Example (API Service):**
        ```typescript
        const chatService = new ChatAPIService('https://api.example.com', token);
        async function getRoomDetails(roomId) {
          const response = await chatService.request(`/api/chat/rooms/${roomId}`);
          console.log('Room details:', response.data);
        }
        ```
      parameters:
        - $ref: '#/components/parameters/RoomId'
      responses:
        '200':
          description: Room details retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/RoomDetails'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /api/chat/rooms/{roomId}/join:
    post:
      security:
        - BearerAuth: []
      tags:
        - Room Management
      summary: Join chat room
      description: |
        Join an existing chat room as a participant.

        **WebSocket Integration:**
        - **Event: join_room**: Client emits to join a chat room.
          ```javascript
          socket.emit('join_room', { roomId: 'room-uuid' });
          ```
        - **Event: room_joined**: Confirmation of joining the room.
          ```javascript
          socket.on('room_joined', (data) => {
            console.log('Joined room:', data.room);
          });
          ```
        - **Event: user_joined_room**: Notifies others when a user joins.
          ```javascript
          socket.on('user_joined_room', (data) => {
            console.log(`${data.user.name} joined room ${data.roomId}`);
          });
          ```

        **Frontend Example (React Hook):**
        ```typescript
        const { joinRoom } = useChat(token);
        useEffect(() => {
          joinRoom(roomId);
        }, [roomId]);
        ```
      parameters:
        - $ref: '#/components/parameters/RoomId'
      responses:
        '200':
          description: Successfully joined room
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /api/chat/rooms/{roomId}/leave:
    post:
      security:
        - BearerAuth: []
      tags:
        - Room Management
      summary: Leave chat room
      description: |
        Leave a chat room and become an inactive participant.

        **WebSocket Integration:**
        - **Event: leave_room**: Client emits to leave a chat room.
          ```javascript
          socket.emit('leave_room', { roomId: 'room-uuid' });
          ```
        - **Event: room_left**: Confirmation of leaving the room.
          ```javascript
          socket.on('room_left', (data) => {
            console.log('Left room:', data.roomId);
          });
          ```
        - **Event: user_left_room**: Notifies others when a user leaves.
          ```javascript
          socket.on('user_left_room', (data) => {
            console.log(`User ${data.userId} left room ${data.roomId}`);
          });
         ```
        **Frontend Example (API Service):**
        ```typescript
        const chatService = new ChatAPIService('https://api.example.com', token);
        async function leaveRoom(roomId) {
          await chatService.request(`/api/chat/rooms/${roomId}/leave`, { method: 'POST' });
          console.log('Left room:', roomId);
        }
        ```
      parameters:
        - $ref: '#/components/parameters/RoomId'
      responses:
        '200':
          description: Successfully left room
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /api/chat/rooms/{roomId}/participants:
    get:
      security:
        - BearerAuth: []
      tags:
        - Room Management
      summary: Get room participants
      description: |
        Retrieve a list of active participants in a chat room.

        **WebSocket Integration:**
        - **Event: user_joined_room**: Notifies when a new participant joins.
          ```javascript
          socket.on('user_joined_room', (data) => {
            console.log(`${data.user.name} joined room ${data.roomId}`);
          });
          ```
        - **Event: user_left_room**: Notifies when a participant leaves.
          ```javascript
          socket.on('user_left_room', (data) => {
            console.log(`User ${data.userId} left room ${data.roomId}`);
          });
          ```

        **Frontend Example (API Service):**
        ```typescript
        const chatService = new ChatAPIService('https://api.example.com', token);
        async function getParticipants(roomId) {
          const response = await chatService.request(`/api/chat/rooms/${roomId}/participants`);
          console.log('Participants:', response.data);
        }
        ```
      parameters:
        - $ref: '#/components/parameters/RoomId'
      responses:
        '200':
          description: Participants retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Participant'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /api/chat/rooms/{roomId}/messages:
    get:
      security:
        - BearerAuth: []
      tags:
        - Message Management
      summary: Get messages
      description: |
        Retrieve messages from a chat room with pagination and filtering options.

        **WebSocket Integration:**
        - **Event: new_message**: Notifies when a new message is received.
          ```javascript
          socket.on('new_message', (message) => {
            console.log('New message from:', message.sender.fullName);
            console.log('Content:', message.content);
            displayMessage(message);
          });
          ```

        **Frontend Example (API Service):**
        ```typescript
        const chatService = new ChatAPIService('https://api.example.com', token);
        async function fetchMessages(roomId) {
          const response = await chatService.getMessages(roomId, { limit: 50 });
          console.log('Messages:', response.data);
        }
        ```
      parameters:
        - $ref: '#/components/parameters/RoomId'
        - name: limit
          in: query
          description: Number of messages to retrieve (max 100)
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - name: offset
          in: query
          description: Number of messages to skip for pagination
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: since
          in: query
          description: Get messages since this timestamp
          schema:
            type: string
            format: date-time
        - name: until
          in: query
          description: Get messages until this timestamp
          schema:
            type: string
            format: date-time
        - name: type
          in: query
          description: Filter by message type
          schema:
            type: string
            enum: [text, image, file, system]
      responses:
        '200':
          description: Messages retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Message'
              example:
                success: true
                data:
                  - id: "msg123"
                    content: "Hello, how can I help you today?"
                    type: "text"
                    sender:
                      id: "user456"
                      fullName: "Dr. Smith"
                      email: "dr.smith@hospital.com"
                    edited: false
                    deleted: false
                    createdAt: "2025-06-14T10:30:00Z"
                    updatedAt: "2025-06-14T10:30:00Z"
        '400':
          $ref: '#/components/responses/BadRequestError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

    post:
      security:
        - BearerAuth: []
      tags:
        - Message Management
      summary: Send message
      description: |
        Send a new message to a chat room.

        **WebSocket Integration:**
        - **Event: send_message**: Client emits to send a message.
          ```javascript
          socket.emit('send_message', {
            roomId: 'room-uuid',
            content: 'Hello world',
            type: 'text',
            metadata: {},
            replyToId: 'message-uuid'
          });
          ```
        - **Event: new_message**: Notifies when the message is received.
          ```javascript
          socket.on('new_message', (message) => {
            console.log('New message:', message.content);
            displayMessage(message);
          });
          ```

        **Frontend Example (React Component):**
        ```typescript
        const { sendMessage } = useChat(token);
        const handleSendMessage = (e) => {
          e.preventDefault();
          sendMessage(roomId, newMessage);
          setNewMessage('');
        };
        ```
      parameters:
        - $ref: '#/components/parameters/RoomId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendMessageRequest'
            example:
              content: "Thank you for the consultation. I'll follow up with the test results."
              type: "text"
              replyToId: "msg456"
              metadata:
                priority: "normal"
                tags: ["follow-up", "test-results"]
      responses:
        '201':
          description: Message sent successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/Message'
                  message:
                    type: string
        '400':
          $ref: '#/components/responses/BadRequestError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

  /api/chat/messages/{messageId}:
    put:
      security:
        - BearerAuth: []
      tags:
        - Message Management
      summary: Edit message
      description: |
        Edit an existing message (only by the original sender).

        **WebSocket Integration:**
        - **Event: edit_message**: Client emits to edit a message.
          ```javascript
          socket.emit('edit_message', {
            messageId: 'message-uuid',
            content: 'Updated content'
          });
          ```
        - **Event: message_edited**: Notifies when a message is edited.
          ```javascript
          socket.on('message_edited', (message) => {
            console.log('Message edited:', message.id);
            updateMessageInUI(message);
          });
          ```

        **Frontend Example (API Service):**
        ```typescript
        const chatService = new ChatAPIService('https://api.example.com', token);
        async function editMessage(messageId, content) {
          const response = await chatService.editMessage(messageId, content);
          console.log('Edited message:', response.data);
        }
        ```
      parameters:
        - $ref: '#/components/parameters/MessageId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - content
              properties:
                content:
                  type: string
                  maxLength: 4000
                  description: New message content
            example:
              content: "Thank you for the consultation. I'll follow up with the updated test results."
      responses:
        '200':
          description: Message edited successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/Message'
                  message:
                    type: string
        '400':
          $ref: '#/components/responses/BadRequestError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'

    delete:
      security:
        - BearerAuth: []
      tags:
        - Message Management
      summary: Delete message
      description: |
        Delete a message (soft delete by default, hard delete for admins).

        **WebSocket Integration:**
        - **Event: delete_message**: Client emits to delete a message.
          ```javascript
          socket.emit('delete_message', {
            messageId: 'message-uuid',
            soft: true
          });
          ```
        - **Event: message_deleted**: Notifies when a message is deleted.
          ```javascript
          socket.on('message_deleted', (data) => {
            console.log('Message deleted:', data.messageId);
            if (data.soft) {
              markMessageAsDeleted(data.messageId);
            } else {
              removeMessageFrom oiseaux(data.messageId);
            }
          });
          ```

        **Frontend Example (API Service):**
        ```typescript
        const chatService = new ChatAPIService('https://api.example.com', token);
        async function deleteMessage(messageId, soft = true) {
          await chatService.deleteMessage(messageId, soft);
          console.log('Message deleted:', messageId);
        }
        ```
      parameters:
        - $ref: '#/components/parameters/MessageId'
        - name: soft
          in: query
          description: Whether to perform soft delete (default) or hard delete
          schema:
            type: boolean
            default: true
      responses:
        '200':
          description: Message deleted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /api/chat/rooms/{roomId}/read:
    post:
      security:
        - BearerAuth: []
      tags:
        - Message Management
      summary: Mark messages as read
      description: |
        Mark messages as read up to a specific message or all messages in a room.

        **WebSocket Integration:**
        - **Event: mark_read**: Client emits to mark messages as read.
          ```javascript
          socket.emit('mark_read', {
            roomId: 'room-uuid',
            messageId: 'message-uuid'
          });
          ```
        - **Event: message_read**: Notifies when a message is read by someone.
          ```javascript
          socket.on('message_read', (data) => {
            console.log(`Message ${data.messageId} read by ${data.readBy}`);
            updateReadStatus(data.messageId, data.readBy);
          });
          ```

        **Frontend Example (API Service):**
        ```typescript
        const chatService = new ChatAPIService('https://api.example.com', token);
        async function markMessagesRead(roomId, messageId) {
          await chatService.markAsRead(roomId, messageId);
          console.log('Messages marked as read');
        }
        ```
      parameters:
        - $ref: '#/components/parameters/RoomId'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                messageId:
                  type: string
                  format: uuid
                  description: Mark as read up to this message (optional, marks all if not provided)
      responses:
        '200':
          description: Messages marked as read
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

  /api/chat/rooms/{roomId}/search:
    get:
      security:
        - BearerAuth: []
      tags:
        - Message Management
      summary: Search messages
      description: |
        Search for messages within a chat room.

        **Frontend Example (API Service):**
        ```typescript
        const chatService = new ChatAPIService('https://api.example.com', token);
        async function searchMessages(roomId, query) {
          const response = await chatService.searchMessages(roomId, query, { limit: 20 });
          console.log('Search results:', response.data);
        }
        ```
      parameters:
        - $ref: '#/components/parameters/RoomId'
        - name: q
          in: query
          required: true
          description: Search query string
          schema:
            type: string
            minLength: 1
        - name: limit
          in: query
          description: Number of results to return
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
        - name: offset
          in: query
          description: Number of results to skip
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        '200':
          description: Search results retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Message'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

  /api/chat/appointment:
    post:
      security:
        - BearerAuth: []
      tags:
        - Appointment Chat
      summary: Create appointment chat
      description: |
        Create a scheduled chat session for medical appointments (doctors only).

        **WebSocket Integration:**
        - **Event: appointment_joined**: Notifies when the appointment chat is joined.
          ```javascript
          socket.on('appointment_joined', (data) => {
            console.log('Joined appointment chat:', data.appointmentChat);
            initializeAppointmentUI(data.room);
          });
          ```

        **Frontend Example (API Service):**
        ```typescript
        const chatService = new ChatAPIService('https://api.example.com', token);
        async function createAppointmentChat() {
          const appointmentData = {
            appointmentId: "apt123",
            patientId: "user789",
            scheduledStartTime: "2025-06-15T14:00:00Z",
            scheduledEndTime: "2025-06-15T14:30:00Z",
            settings: { autoCloseEnabled: true, preJoinAllowed: false, postChatDuration: 300 }
          };
          const response = await chatService.createAppointmentChat(appointmentData);
          console.log('Appointment chat created:', response.data);
        }
        ```
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAppointmentChatRequest'
            example:
              appointmentId: "apt123"
              patientId: "user789"
              scheduledStartTime: "2025-06-15T14:00:00Z"
              scheduledEndTime: "2025-06-15T14:30:00Z"
              settings:
                autoCloseEnabled: true
                preJoinAllowed: false
                postChatDuration: 300
      responses:
        '201':
          description: Appointment chat created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/AppointmentChat'
                  message:
                    type: string
        '400':
          $ref: '#/components/responses/BadRequestError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

    get:
      security:
        - BearerAuth: []
      tags:
        - Appointment Chat
      summary: Get user's appointment chats
      description: |
        Retrieve appointment chats for the authenticated user (as doctor or patient).

        **Frontend Example (API Service):**
        ```typescript
        const chatService = new ChatAPIService('https://api.example.com', token);
        async function getAppointmentChats(status) {
          const response = await chatService.getAppointmentChats(status);
          console.log('Appointment chats:', response.data);
        }
        ```
      parameters:
        - name: status
          in: query
          description: Filter by appointment chat status
          schema:
            type: string
            enum: [scheduled, active, completed, cancelled]
      responses:
        '200':
          description: Appointment chats retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/AppointmentChat'

  /api/chat/appointment/{appointmentChatId}/status:
    get:
      security:
        - BearerAuth: []
      tags:
        - Appointment Chat
      summary: Get appointment chat status
      description: |
        Get detailed status and timing information for an appointment chat.

        **WebSocket Integration:**
