x-websocket-events:
  description: |
    The chat system uses WebSocket for real-time communication. Connect to the WebSocket endpoint with authentication.
    
    ## Connection
    ```javascript
    const socket = io('/api/chat', {
      auth: { token: 'your-jwt-token' }
    });
    ```
    
    ## Client-to-Server Events
    
    ### Room Management
    - **join_room**: Join a chat room
      ```javascript
      socket.emit('join_room', { roomId: 'room-uuid' });
      ```
    
    - **leave_room**: Leave a chat room
      ```javascript
      socket.emit('leave_room', { roomId: 'room-uuid' });
      ```
    
    ### Messaging
    - **send_message**: Send a message
      ```javascript
      socket.emit('send_message', {
        roomId: 'room-uuid',
        content: 'Hello world',
        type: 'text',
        metadata: {},
        replyToId: 'message-uuid' // optional
      });
      ```
    
    - **edit_message**: Edit a message
      ```javascript
      socket.emit('edit_message', {
        messageId: 'message-uuid',
        content: 'Updated content'
      });
      ```
    
    - **delete_message**: Delete a message
      ```javascript
      socket.emit('delete_message', {
        messageId: 'message-uuid',
        soft: true
      });
      ```
    
    ### Typing Indicators
    - **typing_start**: Indicate user started typing
      ```javascript
      socket.emit('typing_start', { roomId: 'room-uuid' });
      ```
    
    - **typing_stop**: Indicate user stopped typing
      ```javascript
      socket.emit('typing_stop', { roomId: 'room-uuid' });
      ```
    
    ### Read Status
    - **mark_read**: Mark messages as read
      ```javascript
      socket.emit('mark_read', {
        roomId: 'room-uuid',
        messageId: 'message-uuid' // optional, marks all if not provided
      });
      ```
    
    ### Appointment Chat
    - **join_appointment_chat**: Join appointment chat
      ```javascript
      socket.emit('join_appointment_chat', {
        appointmentChatId: 'appointment-uuid'
      });
      ```
    
    - **check_appointment_status**: Check appointment status
      ```javascript
      socket.emit('check_appointment_status', {
        appointmentChatId: 'appointment-uuid'
      });
      ```
    
    ### User Status
    - **update_status**: Update user online status
      ```javascript
      socket.emit('update_status', {
        status: 'online' // online, busy, away, invisible
      });
      ```
    
    ## Server-to-Client Events
    
    ### Connection Events
    - **initial_data**: Sent on connection with user's rooms and data
      ```javascript
      socket.on('initial_data', (data) => {
        console.log('User rooms:', data.rooms);
        console.log('User info:', data.user);
      });
      ```
    
    ### Room Events
    - **room_joined**: Confirmation of joining room
      ```javascript
      socket.on('room_joined', (data) => {
        console.log('Joined room:', data.room);
        console.log('Recent messages:', data.messages);
      });
      ```
    
    - **room_left**: Confirmation of leaving room
      ```javascript
      socket.on('room_left', (data) => {
        console.log('Left room:', data.roomId);
      });
      ```
    
    - **user_joined_room**: Another user joined the room
      ```javascript
      socket.on('user_joined_room', (data) => {
        console.log(`${data.user.name} joined room ${data.roomId}`);
      });
      ```
    
    - **user_left_room**: Another user left the room
      ```javascript
      socket.on('user_left_room', (data) => {
        console.log(`User ${data.userId} left room ${data.roomId}`);
      });
      ```
    
    - **room_updated**: Room information updated
      ```javascript
      socket.on('room_updated', (data) => {
        console.log('Room updated:', data.roomId);
        console.log('Last message:', data.lastMessage);
      });
      ```
    
    ### Message Events
    - **new_message**: New message received
      ```javascript
      socket.on('new_message', (message) => {
        console.log('New message from:', message.sender.fullName);
        console.log('Content:', message.content);
        displayMessage(message);
      });
      ```
    
    - **message_edited**: Message was edited
      ```javascript
      socket.on('message_edited', (message) => {
        console.log('Message edited:', message.id);
        updateMessageInUI(message);
      });
      ```
    
    - **message_deleted**: Message was deleted
      ```javascript
      socket.on('message_deleted', (data) => {
        console.log('Message deleted:', data.messageId);
        if (data.soft) {
          markMessageAsDeleted(data.messageId);
        } else {
          removeMessageFromUI(data.messageId);
        }
      });
      ```
    
    - **message_read**: Message was read by someone
      ```javascript
      socket.on('message_read', (data) => {
        console.log(`Message ${data.messageId} read by ${data.readBy}`);
        updateReadStatus(data.messageId, data.readBy);
      });
      ```
    
    ### Typing Events
    - **user_typing**: User typing status changed
      ```javascript
      socket.on('user_typing', (data) => {
        if (data.isTyping) {
          showTypingIndicator(data.userId, data.roomId);
        } else {
          hideTypingIndicator(data.userId, data.roomId);
        }
      });
      ```
    
    ### User Presence Events
    - **user_online**: User came online
      ```javascript
      socket.on('user_online', (data) => {
        console.log(`${data.user.name} is now online`);
        updateUserStatus(data.userId, 'online');
      });
      ```
    
    - **user_offline**: User went offline
      ```javascript
      socket.on('user_offline', (data) => {
        console.log(`User ${data.userId} went offline`);
        updateUserStatus(data.userId, 'offline');
      });
      ```
    
    - **user_status_changed**: User status changed
      ```javascript
      socket.on('user_status_changed', (data) => {
        console.log(`User ${data.userId} status: ${data.status}`);
        updateUserStatus(data.userId, data.status);
      });
      ```
    
    ### Appointment Events
    - **appointment_joined**: Successfully joined appointment
      ```javascript
      socket.on('appointment_joined', (data) => {
        console.log('Joined appointment chat:', data.appointmentChat);
        initializeAppointmentUI(data.room);
      });
      ```
    
    - **appointment_join_denied**: Join attempt denied
      ```javascript
      socket.on('appointment_join_denied', (data) => {
        console.log('Cannot join:', data.reason);
        if (data.availableAt) {
          console.log('Available at:', data.availableAt);
        }
      });
      ```
    
    - **appointment_participant_joined**: Other participant joined
      ```javascript
      socket.on('appointment_participant_joined', (data) => {
        console.log(`${data.user.name} joined the appointment`);
      });
      ```
    
    - **appointment_ended**: Appointment ended
      ```javascript
      socket.on('appointment_ended', (data) => {
        console.log('Appointment ended');
        showAppointmentEndedUI(data.appointmentChat);
      });
      ```
    
    - **appointment_status**: Appointment status update
      ```javascript
      socket.on('appointment_status', (status) => {
        console.log('Appointment status:', status.timeStatus);
        console.log('Time until start:', status.timeUntilStart);
        updateAppointmentTimer(status);
      });
      ```
    
    ### Error Events
    - **error**: Error occurred
      ```javascript
      socket.on('error', (error) => {
        console.error('Chat error:', error.message);
        showErrorToUser(error.message);
      });
      ```

x-frontend-examples:
  description: |
    ## Frontend Integration Examples
    
    ### React Hook for Chat
    ```typescript
    import { useEffect, useState } from 'react';
    import io, { Socket } from 'socket.io-client';
    
    interface Message {
      id: string;
      content: string;
      sender: {
        id: string;
        fullName: string;
      };
      createdAt: string;
    }
    
    interface Room {
      id: string;
      name: string;
      type: string;
      unreadCount: number;
    }
    
    export const useChat = (token: string) => {
      const [socket, setSocket] = useState<Socket | null>(null);
      const [rooms, setRooms] = useState<Room[]>([]);
      const [messages, setMessages] = useState<Record<string, Message[]>>({});
      const [isConnected, setIsConnected] = useState(false);
    
      useEffect(() => {
        const newSocket = io('/api/chat', {
          auth: { token }
        });
    
        newSocket.on('connect', () => {
          setIsConnected(true);
        });
    
        newSocket.on('disconnect', () => {
          setIsConnected(false);
        });
    
        newSocket.on('initial_data', (data) => {
          setRooms(data.rooms);
        });
    
        newSocket.on('new_message', (message: Message) => {
          setMessages(prev => ({
            ...prev,
            [message.room.id]: [...(prev[message.room.id] || []), message]
          }));
        });
    
        setSocket(newSocket);
    
        return () => newSocket.close();
      }, [token]);
    
      const sendMessage = (roomId: string, content: string) => {
        if (socket) {
          socket.emit('send_message', { roomId, content, type: 'text' });
        }
      };
    
      const joinRoom = (roomId: string) => {
        if (socket) {
          socket.emit('join_room', { roomId });
        }
      };
    
      return {
        socket,
        rooms,
        messages,
        isConnected,
        sendMessage,
        joinRoom
      };
    };
    ```
    
    ### Chat Component Example
    ```typescript
    import React, { useState, useEffect } from 'react';
    import { useChat } from './hooks/useChat';
    
    interface ChatProps {
      token: string;
      roomId: string;
    }
    
    export const ChatComponent: React.FC<ChatProps> = ({ token, roomId }) => {
      const { socket, messages, sendMessage, joinRoom } = useChat(token);
      const [newMessage, setNewMessage] = useState('');
      const [isTyping, setIsTyping] = useState(false);
    
      useEffect(() => {
        if (socket && roomId) {
          joinRoom(roomId);
        }
      }, [socket, roomId, joinRoom]);
    
      const handleSendMessage = (e: React.FormEvent) => {
        e.preventDefault();
        if (newMessage.trim()) {
          sendMessage(roomId, newMessage);
          setNewMessage('');
        }
      };
    
      const handleTyping = (e: React.ChangeEvent<HTMLInputElement>) => {
        setNewMessage(e.target.value);
        
        if (!isTyping) {
          setIsTyping(true);
          socket?.emit('typing_start', { roomId });
        }
        
        // Stop typing after 3 seconds of inactivity
        setTimeout(() => {
          setIsTyping(false);
          socket?.emit('typing_stop', { roomId });
        }, 3000);
      };
    
      const roomMessages = messages[roomId] || [];
    
      return (
        <div className="chat-container">
          <div className="messages">
            {roomMessages.map((message) => (
              <div key={message.id} className="message">
                <strong>{message.sender.fullName}:</strong> {message.content}
                <span className="timestamp">
                  {new Date(message.createdAt).toLocaleTimeString()}
                </span>
              </div>
            ))}
          </div>
          
          <form onSubmit={handleSendMessage} className="message-input">
            <input
              type="text"
              value={newMessage}
              onChange={handleTyping}
              placeholder="Type a message..."
              maxLength={4000}
            />
            <button type="submit" disabled={!newMessage.trim()}>
              Send
            </button>
          </form>
        </div>
      );
    };
    ```
    
    ### Appointment Chat Component
    ```typescript
    import React, { useState, useEffect } from 'react';
    import { useChat } from './hooks/useChat';
    
    interface AppointmentChatProps {
      token: string;
      appointmentChatId: string;
    }
    
    export const AppointmentChat: React.FC<AppointmentChatProps> = ({
      token,
      appointmentChatId
    }) => {
      const { socket } = useChat(token);
      const [appointmentStatus, setAppointmentStatus] = useState<any>(null);
      const [canJoin, setCanJoin] = useState(false);
      const [timeUntilStart, setTimeUntilStart] = useState(0);
    
      useEffect(() => {
        if (socket) {
          // Check appointment status
          socket.emit('check_appointment_status', { appointmentChatId });
          
          socket.on('appointment_status', (status) => {
            setAppointmentStatus(status);
            setTimeUntilStart(status.timeUntilStart);
            setCanJoin(status.timeStatus === 'active' || status.preJoinAllowed);
          });
          
          socket.on('appointment_join_denied', (data) => {
            alert(`Cannot join: ${data.reason}`);
          });
          
          socket.on('appointment_joined', (data) => {
            setCanJoin(true);
          });
        }
      }, [socket, appointmentChatId]);
    
      const joinAppointment = () => {
        if (socket) {
          socket.emit('join_appointment_chat', { appointmentChatId });
        }
      };
    
      const formatTime = (ms: number) => {
        const minutes = Math.floor(ms / 60000);
        const seconds = Math.floor((ms % 60000) / 1000);
        return `${minutes}:${seconds.toString().padStart(2, '0')}`;
      };
    
      if (!appointmentStatus) {
        return <div>Loading appointment...</div>;
      }
    
      return (
        <div className="appointment-chat">
          <div className="appointment-header">
            <h3>Appointment with {appointmentStatus.doctor.fullName}</h3>
            <p>Status: {appointmentStatus.timeStatus}</p>
            
            {timeUntilStart > 0 && (
              <p>Starts in: {formatTime(timeUntilStart)}</p>
            )}
          </div>
          
          {canJoin ? (
            <ChatComponent token={token} roomId={appointmentStatus.room.id} />
          ) : (
            <div className="waiting-room">
              <p>Waiting for appointment to start...</p>
              <button onClick={joinAppointment} disabled={!canJoin}>
                Join Appointment
              </button>
            </div>
          )}
        </div>
      );
    };
    ```
    
    ### API Service Class
    ```typescript
    class ChatAPIService {
      private baseURL: string;
      private token: string;
    
      constructor(baseURL: string, token: string) {
        this.baseURL = baseURL;
        this.token = token;
      }
    
      private async request(endpoint: string, options: RequestInit = {}) {
        const response = await fetch(`${this.baseURL}${endpoint}`, {
          ...options,
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${this.token}`,
            ...options.headers,
          },
        });
    
        if (!response.ok) {
          throw new Error(`API Error: ${response.statusText}`);
        }
    
        return response.json();
      }
    
      // Room management
      async getRooms() {
        return this.request('/api/chat/rooms');
      }
    
      async createRoom(roomData: any) {
        return this.request('/api/chat/rooms', {
          method: 'POST',
          body: JSON.stringify(roomData),
        });
      }
    
      async createDirectChat(targetUserId: string) {
        return this.request('/api/chat/direct', {
          method: 'POST',
          body: JSON.stringify({ targetUserId }),
        });
      }
    
      // Message management
      async getMessages(roomId: string, options: any = {}) {
        const params = new URLSearchParams(options);
        return this.request(`/api/chat/rooms/${roomId}/messages?${params}`);
      }
    
      async sendMessage(roomId: string, content: string, options: any = {}) {
        return this.request(`/api/chat/rooms/${roomId}/messages`, {
          method: 'POST',
          body: JSON.stringify({ content, ...options }),
        });
      }
    
      async editMessage(messageId: string, content: string) {
        return this.request(`/api/chat/messages/${messageId}`, {
          method: 'PUT',
          body: JSON.stringify({ content }),
        });
      }
    
      async deleteMessage(messageId: string, soft: boolean = true) {
        return this.request(`/api/chat/messages/${messageId}?soft=${soft}`, {
          method: 'DELETE',
        });
      }
    
      async markAsRead(roomId: string, messageId?: string) {
        return this.request(`/api/chat/rooms/${roomId}/read`, {
          method: 'POST',
          body: JSON.stringify({ messageId }),
        });
      }
    
      async searchMessages(roomId: string, query: string, options: any = {}) {
        const params = new URLSearchParams({ q: query, ...options });
        return this.request(`/api/chat/rooms/${roomId}/search?${params}`);
      }
    
      // Appointment chat
      async createAppointmentChat(appointmentData: any) {
        return this.request('/api/chat/appointment', {
          method: 'POST',
          body: JSON.stringify(appointmentData),
        });
      }
    
      async getAppointmentChats(status?: string) {
        const params = status ? `?status=${status}` : '';
        return this.request(`/api/chat/appointment${params}`);
      }
    
      async joinAppointmentChat(appointmentChatId: string) {
        return this.request(`/api/chat/appointment/${appointmentChatId}/join`, {
          method: 'POST',
        });
      }
    
      async endAppointmentChat(appointmentChatId: string) {
        return this.request(`/api/chat/appointment/${appointmentChatId}/end`, {
          method: 'POST',
        });
      }
    
      // Utility
      async getUnreadCounts() {
        return this.request('/api/chat/unread-counts');
      }
    
      async getHealthStatus() {
        return this.request('/api/chat/health');
      }
    }
    
    export default ChatAPIService;
    ```

x-error-codes:
  description: |
    ## Error Handling
    
    The API returns consistent error responses with the following structure:
    
    ```json
    {
      "success": false,
      "message": "Human-readable error message",
      "error": "ERROR_CODE"
    }
    ```
    
    ### Common Error Codes
    
    - **UNAUTHORIZED**: Authentication required or token invalid
    - **FORBIDDEN**: Access denied - insufficient permissions
    - **NOT_FOUND**: Resource not found
    - **BAD_REQUEST**: Invalid request data
    - **VALIDATION_ERROR**: Request validation failed
    - **RATE_LIMIT_EXCEEDED**: Too many requests
    - **ROOM_FULL**: Cannot join room - at capacity
    - **MESSAGE_TOO_LONG**: Message exceeds 4000 character limit
    - **APPOINTMENT_NOT_AVAILABLE**: Appointment chat not yet available
    - **APPOINTMENT_EXPIRED**: Appointment chat has expired
    - **INTERNAL_ERROR**: Internal server error
    
    ### WebSocket Error Handling
    
    ```javascript
    socket.on('error', (error) => {
      switch (error.code) {
        case 'AUTHENTICATION_FAILED':
          // Redirect to login
          break;
        case 'ROOM_ACCESS_DENIED':
          // Show access denied message
          break;
        case 'MESSAGE_SEND_FAILED':
          // Retry sending message
          break;
        default:
          // Show generic error
          console.error('Chat error:', error.message);
      }
    });
    ```

x-best-practices:
  description: |
    ## Best Practices for Frontend Integration
    
    ### 1. Connection Management
    - Always handle connection/disconnection events
    - Implement automatic reconnection with exponential backoff
    - Store messages locally and sync when reconnected
    
    ### 2. Message Handling
    - Implement optimistic UI updates for sent messages
    - Handle message editing and deletion gracefully
    - Show appropriate loading states
    
