paths:
  /api/firstaid/content/steps/condition/{conditionId}:
    get:
      summary: Get steps by condition ID
      description: >-
        Retrieve the emergency step for a specific condition and age group (public endpoint).
        If categoryType is omitted, or if no step has been created yet for the requested
        age group, this falls back to the "general" category step for the condition.
      tags: [First Aid - Emergency Steps]
      parameters:
        - name: conditionId
          in: path
          required: true
          description: Condition UUID
          schema:
            type: string
            format: uuid
        - name: categoryType
          in: query
          description: >-
            Optional age group filter. Defaults to "general" when omitted, and falls back to
            "general" if no step exists yet for the requested age group.
          schema:
            type: string
            enum:
              - general
              - adults
              - children
              - infants
      responses:
        '200':
          description: Successfully retrieved the emergency step (may be a fallback to "general")
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: './stepComponents.yaml#/components/schemas/EmergencyStep'
        '400':
          description: Invalid condition ID or category
        '404':
          description: Condition not found, or no step exists for this condition in any category
        '500':
          description: Internal server error

  /api/firstaid/content/steps:
    get:
      summary: Get all steps (Admin)
      description: Retrieve all emergency steps - admin access required
      tags: [First Aid - Emergency Steps (Admin)]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Successfully retrieved all steps
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: './stepComponents.yaml#/components/schemas/EmergencyStep'
                  count:
                    type: integer
                    description: Number of steps returned
                    example: 10
        '401':
          description: Unauthorized - authentication required
        '403':
          description: Forbidden - admin access required
        '500':
          description: Internal server error

    post:
      summary: Create new step (Admin)
      description: Create a new emergency step with optional image upload - admin access required
      tags: [First Aid - Emergency Steps (Admin)]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: './stepComponents.yaml#/components/schemas/CreateStepRequest'
      responses:
        '201':
          description: Step created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Emergency step created successfully"
                  data:
                    $ref: './stepComponents.yaml#/components/schemas/EmergencyStep'
        '400':
          description: Validation error or file upload error
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    examples:
                      - "Validation failed"
                      - "Condition not found"
                      - "File too large. Maximum size is 10MB"
                      - "Invalid file type. Allowed types: image/jpeg, image/png, image/gif, application/pdf, image/tiff"
        '401':
          description: Unauthorized - authentication required
        '403':
          description: Forbidden - admin access required
        '500':
          description: Internal server error

  /api/firstaid/content/steps/{id}:
    get:
      summary: Get step by ID (Admin)
      description: Retrieve a specific emergency step by its ID - admin access required
      tags: [First Aid - Emergency Steps (Admin)]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Step UUID
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Successfully retrieved step
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: './stepComponents.yaml#/components/schemas/EmergencyStep'
        '400':
          description: Invalid step ID
        '401':
          description: Unauthorized - authentication required
        '403':
          description: Forbidden - admin access required
        '404':
          description: Step not found
        '500':
          description: Internal server error

    put:
      summary: Update step (Admin)
      description: Update an existing emergency step with optional image upload - admin access required
      tags: [First Aid - Emergency Steps (Admin)]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Step UUID
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: './stepComponents.yaml#/components/schemas/UpdateStepRequest'
      responses:
        '200':
          description: Step updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Emergency step updated successfully"
                  data:
                    $ref: './stepComponents.yaml#/components/schemas/EmergencyStep'
        '400':
          description: Validation error, file upload error, or invalid step ID
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    examples:
                      - "Validation failed"
                      - "Step not found"
                      - "File too large. Maximum size is 10MB"
                      - "Invalid file type. Allowed types: image/jpeg, image/png, image/gif, application/pdf, image/tiff"
        '401':
          description: Unauthorized - authentication required
        '403':
          description: Forbidden - admin access required
        '404':
          description: Step not found
        '500':
          description: Internal server error

    delete:
      summary: Delete step (Admin)
      description: Delete an emergency step - admin access required
      tags: [First Aid - Emergency Steps (Admin)]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Step UUID
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Step deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Emergency step deleted successfully"
        '400':
          description: Invalid step ID
        '401':
          description: Unauthorized - authentication required
        '403':
          description: Forbidden - admin access required
        '404':
          description: Step not found
        '500':
          description: Internal server error

  /api/firstaid/content/steps/{id}/image:
    post:
      summary: Upload image for step (Admin)
      description: Upload images for an existing emergency step category - admin access required
      tags: [First Aid - Emergency Steps (Admin)]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Step UUID
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                images:
                  type: array
                  items:
                    type: string
                    format: binary
                  description: Images to upload for the step category (use field name "image")
              required:
                - images
      responses:
        '200':
          description: Images uploaded successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Category image uploaded successfully"
                  data:
                    $ref: './stepComponents.yaml#/components/schemas/EmergencyStep'
        '400':
          description: Invalid step ID or file upload error
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    examples:
                      - "File too large. Maximum size is 10MB"
                      - "Too many files. Maximum is 10"
                      - "Unexpected file field. Expected field name: 'files'"
                      - "Invalid file type. Allowed types: image/jpeg, image/png, image/gif, application/pdf, image/tiff"
                      - "Invalid step ID"
        '401':
          description: Unauthorized - authentication required
        '403':
          description: Forbidden - admin access required
        '404':
          description: Step not found
        '500':
          description: Internal server error