              },
              body: JSON.stringify(subscription)
            });
          }
        });
    }
    
    // Service Worker (sw.js)
    self.addEventListener('push', event => {
      const data = event.data.json();
      
      const options = {
        body: data.message,
        icon: '/icon-192x192.png',
        badge: '/badge-72x72.png',
        tag: data.type,
        data: {
          notificationId: data.id,
