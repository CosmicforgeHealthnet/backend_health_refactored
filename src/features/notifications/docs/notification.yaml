  description: |
    ## Backend Push Notification Implementation
    
    ### Node.js with Firebase Admin SDK
    ```javascript
    const admin = require('firebase-admin');
    const webpush = require('web-push');
    
    // Initialize Firebase Admin
    admin.initializeApp({
      credential: admin.credential.applicationDefault()
    });
    
    // Configure web push
    webpush.setVapidDetails(
      'mailto:your-email@example.com',
      process.env.VAPID_PUBLIC_KEY,
      process.env.VAPID_PRIVATE_KEY
    );
    
    class PushNotificationService {
      // Send mobile push notification
      async sendMobilePush(deviceToken, notification) {
        const message = {
          notification: {
            title: notification.type === 'alert' ? 'Alert' : 'Notification',
            body: notification.message
          },
          data: {
            notificationId: notification.id,
            type: notification.type,
            metadata: JSON.stringify(notification.metadata || {})
          },
          token: deviceToken
        };
    
        try {
          const response = await admin.messaging().send(message);
          console.log('Mobile push sent successfully:', response);
          return response;
        } catch (error) {
          console.error('Error sending mobile push:', error);
          throw error;
        }
      }
    
      // Send web push notification
      async sendWebPush(subscription, notification) {
        const payload = JSON.stringify({
          title: notification.type === 'alert' ? 'Alert' : 'Notification',
          message: notification.message,
          id: notification.id,
          type: notification.type,
          metadata: notification.metadata
        });
    
        try {
          const result = await webpush.sendNotification(subscription, payload);
          console.log('Web push sent successfully');
          return result;
        } catch (error) {
          console.error('Error sending web push:', error);
          throw error;
        }
      }
    
      // Send notification to all user devices
      async sendToAllDevices(userId, notification) {
        try {
          // Get user's registered devices
          const devices = await this.getUserDevices(userId);
          
          const promises = devices.map(device => {
            if (device.type === 'mobile') {
              return this.sendMobilePush(device.token, notification);
            } else if (device.type === 'web') {
              return this.sendWebPush(device.subscription, notification);
            }
          });
    
          await Promise.allSettled(promises);
        } catch (error) {
          console.error('Error sending to all devices:', error);
        }
      }
    
      async getUserDevices(userId) {
        // Implementation depends on your database structure
        // Return array of user's registered devices
        return [];
      }
    }
    
    module.exports = PushNotificationService;
    ```
    
    ### Integration with Notification Service
    ```javascript
    // Enhanced NotificationService with push notifications
    const PushNotificationService = require('./pushNotificationService');
    
    class NotificationService {
      constructor() {
        this.notificationRepository = new NotificationRepository();
        this.pushService = new PushNotificationService();
      }
    
      async createNotification(userId, type, message, metadata = null) {
        // Save to database
        const notification = await this.notificationRepository.createNotification(
          userId,
          type,
          message,
          metadata
        );
    
        // Send via WebSocket
        try {
          const io = getIO();
          io.to(`user_${userId}`).emit("notification", notification);
        } catch (socketError) {
          console.error("WebSocket notification failed:", socketError.message);
        }
    
        // Send push notification
        try {
          await this.pushService.sendToAllDevices(userId, notification);
        } catch (pushError) {
          console.error("Push notification failed:", pushError.message);
        }
    
        return notification;
      }
    }
    ```

x-error-codes:
  description: |
    ## Error Handling
    
    The API returns consistent error responses with the following structure:
    
    ```json
    {
      "success": false,
      "message": "Human-readable error message",
      "error": "ERROR_CODE"
    }
    ```
    
    ### Common Error Codes
    
    - **UNAUTHORIZED**: Authentication required or token invalid
    - **FORBIDDEN**: Access denied - insufficient permissions
    - **NOT_FOUND**: Notification not found
    - **BAD_REQUEST**: Invalid request data
    - **VALIDATION_ERROR**: Request validation failed
    - **NOTIFICATION_NOT_FOUND**: Specific notification does not exist
    - **USER_NOT_FOUND**: Target user does not exist
    - **PERMISSION_DENIED**: User cannot access this notification
    - **INVALID_NOTIFICATION_TYPE**: Invalid notification type provided
    - **MESSAGE_TOO_LONG**: Notification message exceeds maximum length
    - **RATE_LIMIT_EXCEEDED**: Too many notifications sent
    - **INTERNAL_ERROR**: Internal server error
    
    ### WebSocket Error Handling
    
    ```javascript
    socket.on('notification_error', (error) => {
      switch (error.code) {
        case 'AUTHENTICATION_FAILED':
          // Redirect to login
          handleAuthenticationError();
          break;
        case 'NOTIFICATION_ACCESS_DENIED':
          // Show access denied message
          showError('Access denied to this notification');
          break;
        case 'NOTIFICATION_NOT_FOUND':
          // Remove notification from UI
          removeNotificationFromUI(error.notificationId);
          break;
        default:
          // Show generic error
          console.error('Notification error:', error.message);
          showError('An error occurred with notifications');
      }
    });
    ```

