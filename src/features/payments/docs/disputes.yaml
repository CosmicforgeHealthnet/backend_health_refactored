# ================================
# DISPUTE ENDPOINTS
# ================================

# docs/api/payments/disputes.yaml
paths:
  /api/payments/disputes/create:
    post:
      tags:
        - Disputes
      summary: Create a refund request
      description: Patient creates a dispute for transaction refund
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDisputeRequest'
      responses:
        '201':
          description: Refund request created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /api/payments/disputes/respond:
    post:
      tags:
        - Disputes
      summary: Respond to dispute
      description: Doctor approves or escalates a dispute
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DisputeResponseRequest'
      responses:
        '200':
          description: Dispute response submitted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /api/payments/disputes/doctor:
    get:
      tags:
        - Disputes
      summary: Get disputes for doctor
      description: Retrieve all disputes for authenticated doctor
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Doctor disputes retrieved successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Dispute'

  /api/payments/disputes/patient:
    get:
      tags:
        - Disputes
      summary: Get disputes for patient
      description: Retrieve all disputes for authenticated patient
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Patient disputes retrieved successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Dispute'

  /api/payments/disputes/pending:
    get:
      tags:
        - Disputes
      summary: Get all pending disputes (Admin)
      description: Admin endpoint to retrieve all pending disputes
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Pending disputes retrieved successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Dispute'
        '403':
          $ref: '#/components/responses/Forbidden'