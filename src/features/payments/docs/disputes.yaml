# ================================
# DISPUTE ENDPOINTS
# ================================

# docs/api/payments/disputes.yaml
paths:
  /api/payments/disputes/create:
    post:
      tags:
        - Disputes
      summary: Create a refund request
      description: Patient creates a dispute for transaction refund
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDisputeRequest'
      responses:
        '201':
          description: Refund request created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /api/payments/disputes/respond:
    post:
      tags:
        - Disputes
      summary: Respond to dispute
      description: Doctor approves or escalates a dispute
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DisputeResponseRequest'
      responses:
        '200':
          description: Dispute response submitted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /api/payments/disputes/doctor:
    get:
      tags:
        - Disputes
      summary: Get disputes for doctor
      description: Retrieve all disputes for authenticated doctor
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Doctor disputes retrieved successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Dispute'

  /api/payments/disputes/patient:
    get:
      tags:
        - Disputes
      summary: Get disputes for patient
      description: Retrieve all disputes for authenticated patient
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Patient disputes retrieved successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Dispute'

  /api/payments/disputes/pending:
    get:
      tags:
        - Disputes
      summary: Get all pending disputes (Admin)
      description: Admin endpoint to retrieve all pending disputes
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Pending disputes retrieved successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Dispute'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/payments/disputes/{disputeId}/resolve:
    post:
      tags:
        - Disputes
      summary: Resolve an escalated dispute (Admin)
      description: Admin approves a refund or rejects a dispute that was escalated by a doctor. Approving triggers an actual refund to the patient via the payment provider.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: disputeId
          required: true
          schema:
            type: string
            format: uuid
          description: ID of the escalated dispute to resolve
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - action
              properties:
                action:
                  type: string
                  enum: [approve, reject]
                  description: "'approve' refunds the patient, 'reject' keeps funds with doctor"
                  example: approve
                refundAmount:
                  type: number
                  description: Optional custom refund amount in USD. Defaults to appointment fee if not specified.
                  example: 45.00
                adminNotes:
                  type: string
                  description: Admin notes on the resolution decision
                  example: "Patient provided valid evidence. Full refund approved."
      responses:
        '200':
          description: Dispute resolved successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          disputeId:
                            type: string
                            format: uuid
                          status:
                            type: string
                            example: resolved
                          action:
                            type: string
                            enum: [approve, reject]
                          adminNotes:
                            type: string
                            nullable: true
                          resolvedAt:
                            type: string
                            format: date-time
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'