      description: Lab facility registered successfully
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
                example: true
              message:
                type: string
                example: Lab facility registered successfully. Awaiting admin approval.
              data:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                  facilityName:
                    type: string
                  status:
                    type: string
                    example: pending_approval
                  adminEmail:
                    type: string
                    format: email
                  submittedAt:
                    type: string
                    format: date-time
    FacilityFound:
      description: Lab facility found
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
                example: true
              message:
                type: string
                example: Facility retrieved successfully
              data:
                $ref: "#/components/schemas/LabFacility"
    FacilitiesFound:
