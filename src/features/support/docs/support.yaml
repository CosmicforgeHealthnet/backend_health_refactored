components:
  parameters:
    UserId:
      name: userId
      in: path
      required: true
      description: User ID
      schema:
        type: string
        format: uuid

    InsuranceId:
      name: id
      in: path
      required: true
      description: Insurance ticket ID
      schema:
        type: string
        format: uuid

    ProviderId:
      name: id
      in: path
      required: true
      description: Healthcare provider ID
      schema:
        type: string
        format: uuid

    ReportId:
      name: id
      in: path
      required: true
      description: Report ID
      schema:
        type: string
        format: uuid

    TransactionId:
      name: id
      in: path
      required: true
      description: Transaction ID
      schema:
        type: string
        format: uuid

    DisputeId:
      name: id
      in: path
      required: true
      description: Dispute ID
      schema:
        type: string
        format: uuid

  schemas:
    # ===================================
    # ACCOUNT SUPPORT SCHEMAS
    # ===================================
    AccountTicket:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: "123e4567-e89b-12d3-a456-426614174000"
        userId:
          type: string
          format: uuid
          example: "123e4567-e89b-12d3-a456-426614174000"
        issueType:
          type: string
          enum: [account_information_error, dependent_account_issue, unable_to_update_profile, deactivation_request, double_accounts_conflict]
          example: "account_information_error"
        description:
          type: string
          example: "My profile shows incorrect personal information that I cannot update"
        screenshotUrl:
          type: string
          example: "https://example.com/screenshots/account_issue.jpg"
        status:
          type: string
          enum: [pending, in_progress, resolved, closed]
          example: "pending"
        priority:
          type: string
          enum: [low, medium, high, urgent]
          example: "medium"
        assignedTo:
          type: string
          example: "support_agent_001"
        resolutionNotes:
          type: string
          example: "Profile information has been corrected and user has been notified"
        resolvedAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        user:
          $ref: '#/components/schemas/User'

    CreateAccountTicketRequest:
      type: object
      required:
        - userId
        - issueType
      properties:
        userId:
          type: string
          format: uuid
          example: "123e4567-e89b-12d3-a456-426614174000"
        issueType:
          type: string
          enum: [account_information_error, dependent_account_issue, unable_to_update_profile, deactivation_request, double_accounts_conflict]
          example: "account_information_error"
        description:
          type: string
          example: "My profile shows incorrect personal information that I cannot update"
        screenshotUrl:
          type: string
          example: "https://example.com/screenshots/account_issue.jpg"
        priority:
          type: string
          enum: [low, medium, high, urgent]
          example: "medium"

    UpdateAccountTicketRequest:
      type: object
      properties:
        issueType:
          type: string
          enum: [account_information_error, dependent_account_issue, unable_to_update_profile, deactivation_request, double_accounts_conflict]
        description:
          type: string
        screenshotUrl:
          type: string
        status:
          type: string
          enum: [pending, in_progress, resolved, closed]
        priority:
          type: string
          enum: [low, medium, high, urgent]
        assignedTo:
          type: string
        resolutionNotes:
          type: string

    AssignTicketRequest:
      type: object
      required:
        - assignedTo
      properties:
        assignedTo:
          type: string
          example: "support_agent_001"

    ResolveTicketRequest:
      type: object
      required:
        - resolutionNotes
      properties:
        resolutionNotes:
          type: string
          example: "Profile information has been corrected and user has been notified"

