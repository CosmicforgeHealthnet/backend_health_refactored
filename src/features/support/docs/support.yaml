paths:
  # ===================================
  # USER SUPPORT DASHBOARD ROUTES
  # ===================================
  /api/support/user/{userId}/dashboard:
    get:
      tags:
        - Support
      summary: Get user's complete support dashboard
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: User support dashboard retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSupportDashboardResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/support/user/{userId}/activity:
    get:
      tags:
        - Support
      summary: Get user's support activity/history
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UserId'
        - name: days
          in: query
          description: Number of days to look back for activity
          required: false
          schema:
            type: integer
            default: 30
            minimum: 1
            maximum: 365
      responses:
        '200':
          description: User support activity retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSupportActivityResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/support/user/{userId}/{ticketType}/{ticketId}:
    get:
      tags:
        - Support
      summary: Get specific ticket details
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UserId'
        - name: ticketType
          in: path
          required: true
          description: Type of ticket
          schema:
            type: string
            enum: [account, insurance, report, dispute]
        - name: ticketId
          in: path
          required: true
          description: Ticket ID
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Ticket details retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketDetailsResponse'
        '403':
          description: Access denied - ticket does not belong to user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                message: "Access denied. This ticket does not belong to you."
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  # ===================================
  # ACCOUNT SUPPORT ROUTES
  # ===================================
  /api/support/account:
    get:
      tags:
        - Support
      summary: Get all account tickets
      security:
        - bearerAuth: []
      parameters:
        - name: userId
          in: query
          description: Filter by user ID
          required: false
          schema:
            type: string
            format: uuid
        - name: issueType
          in: query
          description: Filter by issue type
          required: false
          schema:
            type: string
            enum: [account_information_error, dependent_account_issue, unable_to_update_profile, deactivation_request, double_accounts_conflict]
        - name: status
          in: query
          description: Filter by status
          required: false
          schema:
            type: string
            enum: [pending, in_progress, resolved, closed]
        - name: priority
          in: query
          description: Filter by priority
          required: false
          schema:
            type: string
            enum: [low, medium, high, urgent]
        - name: assignedTo
          in: query
          description: Filter by assigned agent
          required: false
          schema:
            type: string
        - name: page
          in: query
          description: Page number for pagination
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          description: Number of items per page
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Account tickets retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountTicketsResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'

    post:
      tags:
        - Support
      summary: Create account ticket
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAccountTicketRequest'
      responses:
        '201':
          description: Account ticket created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountTicketResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/support/account/{id}:
    get:
      tags:
        - Support
      summary: Get account ticket by ID
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Account ticket ID
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Account ticket retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountTicketResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

    put:
      tags:
        - Support
      summary: Update account ticket
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Account ticket ID
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAccountTicketRequest'
      responses:
        '200':
          description: Account ticket updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountTicketResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/support/account/user/{userId}:
    get:
      tags:
        - Support
      summary: Get user's account tickets
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UserId'
        - name: status
          in: query
          description: Filter by status
          required: false
          schema:
            type: string
            enum: [pending, in_progress, resolved, closed]
        - name: page
          in: query
          description: Page number for pagination
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          description: Number of items per page
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: User account tickets retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountTicketsResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/support/account/{id}/assign:
    post:
      tags:
        - Support
      summary: Assign account ticket to support agent
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Account ticket ID
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignTicketRequest'
      responses:
        '200':
          description: Account ticket assigned successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountTicketResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/support/account/{id}/resolve:
    post:
      tags:
        - Support
      summary: Mark account ticket as resolved
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Account ticket ID
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResolveTicketRequest'
      responses:
        '200':
          description: Account ticket resolved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountTicketResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

