# ================================
# IMAGE UPLOAD ENDPOINTS
# ================================

# docs/images/imageUpload.yaml
paths:
  /api/documents/images/upload:
    post:
      tags:
        - Image Upload
      summary: Upload images and get permanent URLs
      description: |
        Upload one or more images and receive permanent, publicly accessible URLs.
        
        **Key Features:**
        - Returns permanent URLs (no expiration)
        - Images are publicly accessible
        - Automatic folder creation/management
        - Multiple URL formats provided
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                images:
                  type: array
                  items:
                    type: string
                    format: binary
                  description: "Image files (max 10 files, 10MB each)"
                  maxItems: 10
                folderName:
                  type: string
                  description: "Optional custom folder name"
                folderDescription:
                  type: string
                  description: "Optional folder description"
              required:
                - images
      responses:
        '201':
          description: Images uploaded successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImageUploadResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/documents/images/{imageId}:
    get:
      tags:
        - Image Upload
      summary: Serve image publicly (no authentication required)
      description: Serve an image directly using its permanent URL
      parameters:
        - name: imageId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Image served successfully
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
        '404':
          description: Image not found

  /api/documents/images/{imageId}/thumbnail:
    get:
      tags:
        - Image Upload
      summary: Serve image thumbnail
      description: Serve a thumbnail version of the image
      parameters:
        - name: imageId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Thumbnail served successfully
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
        '404':
          description: Image not found