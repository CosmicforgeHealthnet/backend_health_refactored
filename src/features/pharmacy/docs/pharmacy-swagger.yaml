openapi: 3.0.3
info:
  title: CosmicForge Pharmacy API
  version: 1.0.0
  description: API for pharmacy management, registration, and verification
servers:
  - url: http://localhost:3000
    description: Development server
paths:
  /pharmacy/auth/register:
    post:
      summary: Register a new pharmacy
      description: >
        Creates a new pharmacy user account and associated pharmacy profile.

        - Sets user role to "pharmacy" and status to
        "pending_email_verification".

        - Creates a pharmacy profile with "pending" verification status.

        - Sends a verification email (non-blocking); response indicates if email
        was sent successfully.

        - After email verification, pharmacies must upload documents for admin
        approval.
      tags:
        - PharmacyAuth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PharmacySignUp"
      responses:
        "201":
          description: Pharmacy registration successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PharmacyRegistrationResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /pharmacy/auth/login:
    post:
      summary: Login pharmacy user
      tags:
        - PharmacyAuth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PharmacyLogin"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "401":
          description: Invalid credentials
        "403":
          description: Not a pharmacy account
  /pharmacy/auth/profile:
    get:
      summary: Get pharmacy profile
      tags:
        - PharmacyProfile
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Pharmacy profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PharmacyProfileResponse"
        "404":
          description: Profile not found
    put:
      summary: Update pharmacy profile
      tags:
        - PharmacyProfile
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePharmacyProfile"
      responses:
        "200":
          description: Profile updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PharmacyProfileResponse"
  /pharmacy/auth/pricing:
    get:
      summary: Get pharmacy pricing
      tags:
        - PharmacyPricing
      security:
        - bearerAuth: []
      responses:
        "200":
          description: List of pharmacy pricing
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PharmacyPricing"
    post:
      summary: Set pharmacy pricing
      tags:
        - PharmacyPricing
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PharmacyPricingRequest"
      responses:
        "201":
          description: Pricing set successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PharmacyPricing"
  /pharmacy/auth/staff:
    get:
      summary: Get pharmacy staff members
      tags:
        - PharmacyStaff
      security:
        - bearerAuth: []
      responses:
        "200":
          description: List of staff members
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StaffMember"
    post:
      summary: Add a new staff member
      tags:
        - PharmacyStaff
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StaffMemberRequest"
      responses:
        "201":
          description: Staff member added successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffMember"
  /pharmacy/auth/staff/{id}:
    delete:
      summary: Remove a staff member
      tags:
        - PharmacyStaff
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Staff member removed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
  /pharmacy/documents/upload:
    post:
      summary: Upload pharmacy documents
      tags:
        - PharmacyDocuments
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/DocumentUpload"
      responses:
        "200":
          description: Documents uploaded successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentUploadResponse"
        "400":
          description: No documents uploaded
  /pharmacy/documents:
    get:
      summary: Get pharmacy documents
      tags:
        - PharmacyDocuments
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Documents list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentListResponse"
  /pharmacy/admin/verifications/pending:
    get:
      summary: Get pending pharmacy verifications
      tags:
        - PharmacyAdmin
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Pending verifications
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PendingVerificationsResponse"
  /pharmacy/admin/verifications/{verificationId}/assign:
    post:
      summary: Assign verification to admin
      tags:
        - PharmacyAdmin
      security:
        - bearerAuth: []
      parameters:
        - name: verificationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssignVerificationRequest"
      responses:
        "200":
          description: Verification assigned
  /pharmacy/admin/pharmacy/{pharmacyId}/review:
    get:
      summary: Review pharmacy details
      tags:
        - PharmacyAdmin
      security:
        - bearerAuth: []
      parameters:
        - name: pharmacyId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Pharmacy review data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PharmacyReviewResponse"
  /pharmacy/admin/documents/{documentId}/verify:
    post:
      summary: Verify pharmacy document
      tags:
        - PharmacyAdmin
      security:
        - bearerAuth: []
      parameters:
        - name: documentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DocumentVerificationRequest"
      responses:
        "200":
          description: Document verification updated
  /pharmacy/admin/pharmacy/{pharmacyId}/approve:
    post:
      summary: Approve pharmacy
      tags:
        - PharmacyAdmin
      security:
        - bearerAuth: []
      parameters:
        - name: pharmacyId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApprovalRequest"
      responses:
        "200":
          description: Pharmacy approved
  /pharmacy/admin/pharmacy/{pharmacyId}/reject:
    post:
      summary: Reject pharmacy
      tags:
        - PharmacyAdmin
      security:
        - bearerAuth: []
      parameters:
        - name: pharmacyId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RejectionRequest"
      responses:
        "200":
          description: Pharmacy rejected
  /pharmacy/prescriptions/doctor/prescriptions:
    post:
      summary: Create a new prescription
      description: |
        Allows a doctor to create a new prescription during a consultation.
        - Requires patient ID, medications, and consultation details.
        - Generates a unique reference and sets initial status to PENDING.
        - Returns the created prescription with populated relations.
      tags:
        - Prescription
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePrescriptionRequest"
      responses:
        "201":
          description: Prescription created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrescriptionResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized - Invalid or missing token
        "403":
          description: Forbidden - Not a doctor
    get:
      summary: Get doctor's prescriptions
      description: |
        Retrieves a list of prescriptions created by the authenticated doctor.
        - Supports pagination and filtering via query parameters.
      tags:
        - Prescription
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
          description: Page number for pagination
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
          description: Number of prescriptions per page
      responses:
        "200":
          description: List of doctor's prescriptions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PrescriptionResponse"
        "401":
          description: Unauthorized - Invalid or missing token
        "403":
          description: Forbidden - Not a doctor
  /pharmacy/prescriptions/patient/prescriptions/{prescriptionId}/upload:
    post:
      summary: Upload prescription by patient
      description: >
        Allows a patient to upload a prescription to the platform.

        - Verifies the prescription belongs to the patient and is in PENDING
        status.

        - Updates status to PATIENT_UPLOADED.
      tags:
        - Prescription
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: prescriptionId
          required: true
          schema:
            type: string
            format: uuid
          description: ID of the prescription to upload
      responses:
        "200":
          description: Prescription uploaded successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrescriptionResponse"
        "401":
          description: Unauthorized - Invalid or missing token
        "403":
          description: Forbidden - Not the patient's prescription
        "404":
          description: Prescription not found
  /pharmacy/prescriptions/patient/prescriptions/{prescriptionId}/assign-pharmacy:
    post:
      summary: Assign pharmacy to prescription
      description: >
        Allows a patient to assign a pharmacy to fulfill their prescription.

        - Verifies the pharmacy is active and the prescription is in a valid
        state (PENDING or PATIENT_UPLOADED).

        - Updates the prescription with pharmacy and delivery details.
      tags:
        - Prescription
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: prescriptionId
          required: true
          schema:
            type: string
            format: uuid
          description: ID of the prescription
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssignPharmacyRequest"
      responses:
        "200":
          description: Pharmacy assigned successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrescriptionResponse"
        "401":
          description: Unauthorized - Invalid or missing token
        "403":
          description: Forbidden - Not the patient's prescription
        "404":
          description: Prescription or pharmacy not found
  /pharmacy/prescriptions/patient/prescriptions:
    get:
      summary: Get patient's prescriptions
      description: |
        Retrieves a list of prescriptions for the authenticated patient.
        - Supports pagination and filtering via query parameters.
      tags:
        - Prescription
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
          description: Page number for pagination
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
          description: Number of prescriptions per page
      responses:
        "200":
          description: List of patient's prescriptions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PrescriptionResponse"
        "401":
          description: Unauthorized - Invalid or missing token
        "403":
          description: Forbidden - Not a patient
  /pharmacy/prescriptions/pharmacy/prescriptions/{prescriptionId}/start-processing:
    post:
      summary: Start processing prescription
      description: >
        Allows a pharmacy to start processing an assigned prescription.

        - Verifies the prescription is assigned to the pharmacy and in
        PHARMACY_ASSIGNED status.

        - Assigns a pharmacist and updates status to PHARMACY_PROCESSING.
      tags:
        - Prescription
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: prescriptionId
          required: true
          schema:
            type: string
            format: uuid
          description: ID of the prescription
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartProcessingRequest"
      responses:
        "200":
          description: Prescription processing started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrescriptionResponse"
        "401":
          description: Unauthorized - Invalid or missing token
        "403":
          description: Forbidden - Not assigned to this pharmacy
        "404":
          description: Prescription or pharmacist not found
  /pharmacy/prescriptions/pharmacy/prescriptions/{prescriptionId}/provide-costs:
    post:
      summary: Provide medication costs
      description: >
        Allows a pharmacy to provide cost details and invoice for a
        prescription.

        - Calculates total cost including delivery fee and updates payment
        information.
      tags:
        - Prescription
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: prescriptionId
          required: true
          schema:
            type: string
            format: uuid
          description: ID of the prescription
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProvideCostsRequest"
      responses:
        "200":
          description: Costs provided successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrescriptionResponse"
        "401":
          description: Unauthorized - Invalid or missing token
        "403":
          description: Forbidden - Not assigned to this pharmacy
        "404":
          description: Prescription not found
  /pharmacy/prescriptions/pharmacy/prescriptions/{prescriptionId}/mark-ready:
    post:
      summary: Mark prescription as ready
      description: >
        Allows a pharmacy to mark a prescription as ready for delivery or
        pickup.

        - Updates status to READY_FOR_DELIVERY or READY_FOR_PICKUP.
      tags:
        - Prescription
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: prescriptionId
          required: true
          schema:
            type: string
            format: uuid
          description: ID of the prescription
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MarkReadyRequest"
      responses:
        "200":
          description: Prescription marked as ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrescriptionResponse"
        "401":
          description: Unauthorized - Invalid or missing token
        "403":
          description: Forbidden - Not assigned to this pharmacy
        "404":
          description: Prescription not found
  /pharmacy/prescriptions/pharmacy/prescriptions/{prescriptionId}/complete:
    post:
      summary: Complete prescription fulfillment
      description: |
        Allows a pharmacy to mark a prescription as completed.
        - Updates status to COMPLETED and sets payment status to PAID.
      tags:
        - Prescription
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: prescriptionId
          required: true
          schema:
            type: string
            format: uuid
          description: ID of the prescription
      responses:
        "200":
          description: Prescription completed successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrescriptionResponse"
        "401":
          description: Unauthorized - Invalid or missing token
        "403":
          description: Forbidden - Not assigned to this pharmacy
        "404":
          description: Prescription not found
  /pharmacy/prescriptions/pharmacy/prescriptions:
    get:
      summary: Get pharmacy's prescriptions
      description: >
        Retrieves a list of prescriptions assigned to the authenticated
        pharmacy.

        - Supports pagination and filtering via query parameters.
      tags:
        - Prescription
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
          description: Page number for pagination
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
          description: Number of prescriptions per page
      responses:
        "200":
          description: List of pharmacy's prescriptions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PrescriptionResponse"
        "401":
          description: Unauthorized - Invalid or missing token
        "403":
          description: Forbidden - Not a pharmacy
  /pharmacy/prescriptions/pharmacy/dashboard/stats:
    get:
      summary: Get pharmacy dashboard statistics
      description: |
        Retrieves real-time counts for the pharmacy dashboard:
        - Pending requests
        - Active orders
        - Completed today
      tags:
        - Pharmacy Dashboard
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Dashboard statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardStatsResponse"
        "401":
          description: Unauthorized
        "403":
          description: Forbidden - Not a pharmacy
  /pharmacy/prescriptions/pharmacy/dashboard/activity:
    get:
      summary: Get pharmacy activity feed
      description: Retrieves a feed of recent status changes and actions for assigned
        prescriptions.
      tags:
        - Pharmacy Dashboard
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: limit
          schema:
            type: integer
            default: 10
          description: Number of activity items to retrieve
      responses:
        "200":
          description: Activity feed items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ActivityFeedItem"
  /pharmacy/prescriptions/pharmacy/prescriptions/{prescriptionId}/confirm-availability:
    post:
      summary: Confirm medication availability
      description: Marks a prescription as having confirmed medication stock.
      tags:
        - Prescription Operations
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: prescriptionId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Availability confirmed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrescriptionResponse"
  /pharmacy/prescriptions/pharmacy/prescriptions/{prescriptionId}/internal-notes:
    post:
      summary: Add internal pharmacy note
      description: Allows pharmacy staff to add private notes to a prescription.
      tags:
        - Prescription Operations
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: prescriptionId
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InternalNoteRequest"
      responses:
        "201":
          description: Internal note added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrescriptionResponse"
  /pharmacy/prescriptions/pharmacy/prescriptions/{prescriptionId}/propose-alternative:
    post:
      summary: Propose alternative medications
      description: >
        Allows a pharmacy to suggest alternative medications when the prescribed
        ones are unavailable.

        - Updates `availabilityStatus` to `alternatives_proposed`.

        - Stores the alternatives in `internalNotes`.

        - Sends a WebSocket notification and email to the patient immediately.
      tags:
        - Prescription Operations
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: prescriptionId
          required: true
          schema:
            type: string
            format: uuid
          description: ID of the prescription
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - alternatives
              properties:
                alternatives:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required:
                      - name
                    properties:
                      name:
                        type: string
                        example: Amoxicillin 500mg
                      dosage:
                        type: string
                        example: 500mg
                      reason:
                        type: string
                        example: Original brand not in stock
                pharmacistId:
                  type: string
                  format: uuid
                  description: Optional ID of the pharmacist proposing the alternatives
      responses:
        "200":
          description: Alternatives proposed — patient notified via WebSocket and email
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrescriptionResponse"
        "400":
          description: No alternatives provided
        "401":
          description: Unauthorized
        "403":
          description: Forbidden — Not assigned to this pharmacy
        "404":
          description: Prescription not found
  /pharmacy/prescriptions/{prescriptionId}/cancel:
    post:
      summary: Cancel a prescription
      description: |
        Allows a doctor, patient, or pharmacy to cancel a prescription.
        - Requires a cancellation reason.
        - Cannot cancel a completed prescription.
      tags:
        - Prescription
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: prescriptionId
          required: true
          schema:
            type: string
            format: uuid
          description: ID of the prescription
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CancelPrescriptionRequest"
      responses:
        "200":
          description: Prescription cancelled successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrescriptionResponse"
        "401":
          description: Unauthorized - Invalid or missing token
        "403":
          description: Forbidden - User not authorized to cancel
        "404":
          description: Prescription not found
  /pharmacy/prescriptions/{prescriptionId}/chat:
    post:
      summary: Add chat message
      description: >
        Allows a patient or pharmacy to add a chat message related to a
        prescription.

        - Verifies the sender's access to the prescription.
      tags:
        - Prescription
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: prescriptionId
          required: true
          schema:
            type: string
            format: uuid
          description: ID of the prescription
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatMessageRequest"
      responses:
        "200":
          description: Chat message added successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrescriptionResponse"
        "401":
          description: Unauthorized - Invalid or missing token
        "403":
          description: Forbidden - User not authorized to chat
        "404":
          description: Prescription not found
  /pharmacy/prescriptions/{prescriptionId}:
    get:
      summary: Get prescription by ID
      description: >
        Retrieves a specific prescription by its ID with all related details.

        - Accessible by doctors, patients, or pharmacies associated with the
        prescription.
      tags:
        - Prescription
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: prescriptionId
          required: true
          schema:
            type: string
            format: uuid
          description: ID of the prescription
      responses:
        "200":
          description: Prescription details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrescriptionResponse"
        "401":
          description: Unauthorized - Invalid or missing token
        "403":
          description: Forbidden - User not authorized
        "404":
          description: Prescription not found
  /pharmacy/prescriptions/search:
    get:
      summary: Search prescriptions
      description: |
        Searches for prescriptions based on query parameters.
        - Accessible by doctors, patients, or pharmacies.
        - Supports filtering by various criteria (e.g., status, date).
      tags:
        - Prescription
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: query
          schema:
            type: string
          description: Search query string
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
          description: Page number for pagination
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
          description: Number of prescriptions per page
      responses:
        "200":
          description: List of matching prescriptions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PrescriptionResponse"
        "401":
          description: Unauthorized - Invalid or missing token
        "403":
          description: Forbidden - User not authorized
  /auth/verify-email:
    get:
      summary: Verify email token (use main auth endpoint)
      description: "Use the main application's email verification endpoint: GET
        /auth/verify-email"
      tags:
        - PharmacyAuth
      responses:
        "200":
          description: See main auth documentation
  /auth/resend-verification:
    post:
      summary: Resend verification email (use main auth endpoint)
      description: "Use the main application's resend verification endpoint: POST
        /auth/resend-verification"
      tags:
        - PharmacyAuth
      responses:
        "200":
          description: See main auth documentation
components:
  schemas:
    PharmacySignUp:
      type: object
      required:
        - fullName
        - email
        - password
        - pharmacyName
        - registrationNumber
        - preferredUsername
      properties:
        fullName:
          type: string
          example: John Doe
          description: Full name of the primary contact person
        email:
          type: string
          format: email
          example: contact@healthplus.com
          description: Email address for the pharmacy account
        password:
          type: string
          minLength: 12
          example: SecurePassword123!
          description: Password for the pharmacy account
        pharmacyName:
          type: string
          example: HealthPlus Pharmacy
          description: Official name of the pharmacy
        registrationNumber:
          type: string
          example: NG-PH-123456
          description: Pharmacy registration number issued by regulatory authority
        address:
          type: string
          example: 123 Wellness Ave, Lagos, Nigeria
          description: Physical address of the pharmacy
        phone:
          type: string
          example: "+2341234567890"
          description: Contact phone number
        primaryContactPerson:
          type: string
          example: Jane Smith
          description: Name of the primary contact person
        preferredUsername:
          type: string
          example: healthplus
          description: Unique username for the pharmacy profile
    PharmacyLogin:
      type: object
      required:
        - email
        - password
        - deviceFingerprint
      properties:
        email:
          type: string
          format: email
        password:
          type: string
        deviceFingerprint:
          type: string
    PharmacyRegistrationResponse:
      type: object
      properties:
        message:
          type: string
          example: Pharmacy registration successful
        pharmacy:
          type: object
          properties:
            id:
              type: string
              format: uuid
            pharmacyName:
              type: string
            username:
              type: string
            verificationStatus:
              type: string
        user:
          type: object
          properties:
            id:
              type: string
              format: uuid
            fullName:
              type: string
            email:
              type: string
            status:
              type: string
    LoginResponse:
      type: object
      properties:
        payload:
          type: object
        accessToken:
          type: string
        refreshToken:
          type: string
    PharmacyProfileResponse:
      type: object
      properties:
        pharmacy:
          type: object
          properties:
            id:
              type: string
              format: uuid
            pharmacyName:
              type: string
            registrationNumber:
              type: string
            address:
              type: string
            phone:
              type: string
            primaryContactPerson:
              type: string
            email:
              type: string
            username:
              type: string
            verificationStatus:
              type: string
            isActive:
              type: boolean
            operatingHours:
              type: object
            serviceRadius:
              type: number
            defaultCurrency:
              type: string
            notificationPreferences:
              type: object
            pricing:
              type: array
              items:
                $ref: "#/components/schemas/PharmacyPricing"
    UpdatePharmacyProfile:
      type: object
      properties:
        fullName:
          type: string
        pharmacyName:
          type: string
        address:
          type: string
        phone:
          type: string
        primaryContactPerson:
          type: string
        operatingHours:
          type: object
        description:
          type: string
        website:
          type: string
        serviceRadius:
          type: number
        defaultCurrency:
          type: string
        notificationPreferences:
          type: object
    PharmacyPricing:
      type: object
      properties:
        id:
          type: string
          format: uuid
        feeType:
          type: string
          enum:
            - delivery
            - consultation
            - handling
            - processing
        price:
          type: number
        currency:
          type: string
    StaffMember:
      type: object
      properties:
        id:
          type: string
          format: uuid
        fullName:
          type: string
        email:
          type: string
        role:
          type: string
        status:
          type: string
        createdAt:
          type: string
          format: date-time
    StaffMemberRequest:
      type: object
      required:
        - fullName
        - email
        - password
        - role
      properties:
        fullName:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
        role:
          type: string
          enum:
            - pharmacist
            - pharmacy_manager
            - pharmacy_admin
            - pharmacy_assistant
            - dispatcher
        isActive:
          type: boolean
    PharmacyPricingRequest:
      type: object
      required:
        - feeType
        - price
        - currency
      properties:
        feeType:
          type: string
          enum:
            - delivery
            - consultation
            - handling
            - processing
        price:
          type: number
        currency:
          type: string
    DocumentUpload:
      type: object
      properties:
        files:
          type: array
          items:
            type: string
            format: binary
        documentType_0:
          type: string
          enum:
            - pharmacy_license
            - government_id
            - business_registration
            - tax_certificate
            - other
        documentName_0:
          type: string
    DocumentUploadResponse:
      type: object
      properties:
        message:
          type: string
        documents:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
              documentType:
                type: string
              documentName:
                type: string
              submissionStatus:
                type: string
        pharmacy:
          type: object
          properties:
            verificationStatus:
              type: string
    DocumentListResponse:
      type: object
      properties:
        documents:
          type: array
          items:
            type: object
    PendingVerificationsResponse:
      type: object
      properties:
        verifications:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
              pharmacyId:
                type: string
                format: uuid
              pharmacyName:
                type: string
              registrationNumber:
                type: string
              requestType:
                type: string
              status:
                type: string
              priority:
                type: string
              submittedAt:
                type: string
                format: date-time
              assignedTo:
                type: string
                format: uuid
    AssignVerificationRequest:
      type: object
      properties:
        adminId:
          type: string
          format: uuid
    PharmacyReviewResponse:
      type: object
      properties:
        pharmacy:
          type: object
        documents:
          type: array
          items:
            type: object
    DocumentVerificationRequest:
      type: object
      required:
        - isVerified
      properties:
        isVerified:
          type: boolean
        notes:
          type: string
    ApprovalRequest:
      type: object
      properties:
        reviewNotes:
          type: string
    RejectionRequest:
      type: object
      required:
        - rejectionReason
      properties:
        rejectionReason:
          type: string
    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: An error occurred
        error:
          type: string
      required:
        - success
        - message
    CreatePrescriptionRequest:
      type: object
      required:
        - patientId
        - medications
      properties:
        patientId:
          type: string
          format: uuid
          example: 123e4567-e89b-12d3-a456-426614174000
          description: ID of the patient
        medications:
          type: array
          items:
            $ref: "#/components/schemas/Medication"
          description: List of medications in the prescription
        consultationId:
          type: string
          format: uuid
          example: 789e4567-e89b-12d3-a456-426614174000
          description: ID of the associated consultation
        doctorNotes:
          type: string
          example: Take medication with food
          description: Additional notes from the doctor
        diagnosis:
          type: string
          example: Acute Respiratory Infection
          description: Diagnosis from the doctor
        doctorSignature:
          type: string
          example: data:image/png;base64,...
          description: Base64 or URL of the doctor's signature
    Medication:
      type: object
      required:
        - name
        - dosage
        - frequency
        - duration
        - quantity
        - route
      properties:
        name:
          type: string
          example: Amoxicillin
          description: Name of the medication
        dosage:
          type: string
          example: 500mg
          description: Dosage of the medication
        frequency:
          type: string
          example: Twice daily
          description: Frequency of administration
        duration:
          type: string
          example: 7 days
          description: Duration of the medication course
        quantity:
          type: integer
          example: 14
          description: Total quantity of medication units
        route:
          type: string
          example: Oral
          description: Route of administration (e.g., Oral, IV, Topical)
    AssignPharmacyRequest:
      type: object
      required:
        - pharmacyId
      properties:
        pharmacyId:
          type: string
          format: uuid
          example: 456e4567-e89b-12d3-a456-426614174000
          description: ID of the pharmacy to assign
        deliveryDetails:
          type: object
          properties:
            address:
              type: string
              example: 123 Wellness Ave, Lagos, Nigeria
              description: Delivery address
            instructions:
              type: string
              example: Leave at front desk
              description: Delivery instructions
    StartProcessingRequest:
      type: object
      required:
        - pharmacistId
      properties:
        pharmacistId:
          type: string
          format: uuid
          example: 789e4567-e89b-12d3-a456-426614174000
          description: ID of the assigned pharmacist
    ProvideCostsRequest:
      type: object
      required:
        - items
        - paymentMethod
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/InvoiceItem"
          description: List of medication items with costs
        deliveryFee:
          type: number
          example: 10
          description: Delivery fee for the prescription
        paymentMethod:
          type: string
          example: credit_card
          description: Payment method for the prescription
    InvoiceItem:
      type: object
      required:
        - name
        - unitPrice
        - quantity
      properties:
        name:
          type: string
          example: Amoxicillin
          description: Name of the medication
        unitPrice:
          type: number
          example: 5
          description: Price per unit of the medication
        quantity:
          type: integer
          example: 14
          description: Quantity of the medication
    ChatMessageRequest:
      type: object
      required:
        - message
        - senderType
      properties:
        message:
          type: string
          example: Can you confirm delivery time?
          description: Content of the chat message
        senderType:
          type: string
          enum:
            - patient
            - pharmacy
          example: patient
          description: Type of sender (patient or pharmacy)
    MarkReadyRequest:
      type: object
      required:
        - readyType
      properties:
        readyType:
          type: string
          enum:
            - delivery
            - pickup
          example: delivery
          description: Type of readiness (delivery or pickup)
        expectedDate:
          type: string
          format: date-time
          example: 2025-08-30T10:00:00Z
          description: Expected delivery or pickup date (optional)
    InternalNoteRequest:
      type: object
      required:
        - note
        - pharmacistId
      properties:
        note:
          type: string
          example: Patient wants to pickup at 5 PM
        pharmacistId:
          type: string
          format: uuid
    InternalNote:
      type: object
      properties:
        note:
          type: string
        pharmacistId:
          type: string
          format: uuid
        timestamp:
          type: string
          format: date-time
    DashboardStatsResponse:
      type: object
      properties:
        pendingRequests:
          type: integer
        activeOrders:
          type: integer
        completedToday:
          type: integer
    ActivityFeedItem:
      type: object
      properties:
        id:
          type: string
          format: uuid
        reference:
          type: string
        patientName:
          type: string
        action:
          type: string
        status:
          type: string
        timestamp:
          type: string
          format: date-time
    CancelPrescriptionRequest:
      type: object
      required:
        - reason
      properties:
        reason:
          type: string
          example: Patient no longer needs medication
          description: Reason for cancelling the prescription
    PrescriptionResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: 123e4567-e89b-12d3-a456-426614174000
          description: ID of the prescription
        reference:
          type: string
          example: RX-2025-0001
          description: Unique reference number for the prescription
        doctorId:
          type: string
          format: uuid
          example: 456e4567-e89b-12d3-a456-426614174000
          description: ID of the prescribing doctor
        patientId:
          type: string
          format: uuid
          example: 789e4567-e89b-12d3-a456-426614174000
          description: ID of the patient
        consultationId:
          type: string
          format: uuid
          example: 012e4567-e89b-12d3-a456-426614174000
          description: ID of the associated consultation
        pharmacyId:
          type: string
          format: uuid
          example: 345e4567-e89b-12d3-a456-426614174000
          description: ID of the assigned pharmacy
        assignedPharmacistId:
          type: string
          format: uuid
          example: 678e4567-e89b-12d3-a456-426614174000
          description: ID of the assigned pharmacist
        medications:
          type: array
          items:
            $ref: "#/components/schemas/Medication"
          description: List of medications in the prescription
        doctorNotes:
          type: string
          example: Take medication with food
          description: Additional notes from the doctor
        diagnosis:
          type: string
          example: Acute Respiratory Infection
          description: Diagnosis from the doctor
        doctorSignature:
          type: string
          example: https://example.com/signatures/doc123.png
          description: URL or Base64 of the doctor's signature
        status:
          type: string
          enum:
            - PENDING
            - PATIENT_UPLOADED
            - PHARMACY_ASSIGNED
            - PHARMACY_PROCESSING
            - READY_FOR_DELIVERY
            - READY_FOR_PICKUP
            - COMPLETED
            - CANCELLED
          example: PENDING
          description: Current status of the prescription
        paymentStatus:
          type: string
          enum:
            - UNPAID
            - PAID
            - CANCELLED
          example: UNPAID
          description: Payment status of the prescription
        deliveryAddress:
          type: string
          example: 123 Wellness Ave, Lagos, Nigeria
          description: Delivery address for the prescription
        deliveryInstructions:
          type: string
          example: Leave at front desk
          description: Delivery instructions
        expectedDeliveryDate:
          type: string
          format: date-time
          example: 2025-08-30T10:00:00Z
          description: Expected delivery date
        actualDeliveryDate:
          type: string
          format: date-time
          example: 2025-08-30T12:00:00Z
          description: Actual delivery or pickup date
        fulfillmentHistory:
          type: array
          items:
            $ref: "#/components/schemas/FulfillmentHistory"
          description: History of status changes
        chatMessages:
          type: array
          items:
            $ref: "#/components/schemas/ChatMessage"
          description: List of chat messages related to the prescription
        invoiceItems:
          type: array
          items:
            $ref: "#/components/schemas/InvoiceItem"
          description: List of invoice items for the prescription
        deliveryFee:
          type: number
          example: 10
          description: Delivery fee for the prescription
        totalDue:
          type: number
          example: 80
          description: Total amount due for the prescription
        paymentMethod:
          type: string
          example: credit_card
          description: Payment method for the prescription
        createdAt:
          type: string
          format: date-time
          example: 2025-08-26T12:00:00Z
          description: Creation date of the prescription
        updatedAt:
          type: string
          format: date-time
          example: 2025-08-26T12:30:00Z
          description: Last update date of the prescription
        availabilityStatus:
          type: string
          enum:
            - pending
            - confirmed
            - unavailable
            - alternatives_proposed
          example: pending
        internalNotes:
          type: array
          items:
            $ref: "#/components/schemas/InternalNote"
        patientComplaint:
          type: string
          example: Persistent cough and mild fever for 4 days.
        orderedTests:
          type: array
          items:
            type: string
          example:
            - Chest X-ray
            - Complete Blood Count
        appointmentRef:
          type: string
          example: A1B2C3D4
        appointmentDate:
          type: string
          format: date
          example: 2025-08-26
    FulfillmentHistory:
      type: object
      properties:
        status:
          type: string
          enum:
            - PENDING
            - PATIENT_UPLOADED
            - PHARMACY_ASSIGNED
            - PHARMACY_PROCESSING
            - READY_FOR_DELIVERY
            - READY_FOR_PICKUP
            - COMPLETED
            - CANCELLED
          example: PENDING
          description: Status at the time of the history entry
        timestamp:
          type: string
          format: date-time
          example: 2025-08-26T12:00:00Z
          description: Timestamp of the status change
        note:
          type: string
          example: Prescription created by doctor
          description: Note describing the status change
    ChatMessage:
      type: object
      properties:
        senderId:
          type: string
          format: uuid
          example: 789e4567-e89b-12d3-a456-426614174000
          description: ID of the sender (patient or pharmacy)
        senderType:
          type: string
          enum:
            - patient
            - pharmacy
          example: patient
          description: Type of sender
        message:
          type: string
          example: Can you confirm delivery time?
          description: Content of the message
        timestamp:
          type: string
          format: date-time
          example: 2025-08-26T12:00:00Z
          description: Timestamp of the message
    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Operation completed successfully
        data:
          type: object
      required:
        - success
        - message
  parameters: {}
  responses: {}
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
