paths:
  /pharmacy/prescriptions/doctor/prescriptions:
    post:
      summary: Create a new prescription
      description: |
        Allows a doctor to create a new prescription during a consultation.
        - Requires patient ID, medications, and consultation details.
        - Generates a unique reference and sets initial status to PENDING.
        - Returns the created prescription with populated relations.
      tags: [Prescription]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePrescriptionRequest'
      responses:
        '201':
          description: Prescription created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrescriptionResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized - Invalid or missing token
        '403':
          description: Forbidden - Not a doctor
    get:
      summary: Get doctor's prescriptions
      description: |
        Retrieves a list of prescriptions created by the authenticated doctor.
        - Supports pagination and filtering via query parameters.
      tags: [Prescription]
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
          description: Page number for pagination
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
          description: Number of prescriptions per page
      responses:
        '200':
          description: List of doctor's prescriptions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PrescriptionResponse'
        '401':
          description: Unauthorized - Invalid or missing token
        '403':
          description: Forbidden - Not a doctor

  /pharmacy/prescriptions/patient/prescriptions/{prescriptionId}/upload:
    post:
      summary: Upload prescription by patient
      description: |
        Allows a patient to upload a prescription to the platform.
        - Verifies the prescription belongs to the patient and is in PENDING status.
        - Updates status to PATIENT_UPLOADED.
      tags: [Prescription]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: prescriptionId
          required: true
          schema:
            type: string
            format: uuid
          description: ID of the prescription to upload
      responses:
        '200':
          description: Prescription uploaded successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrescriptionResponse'
        '401':
          description: Unauthorized - Invalid or missing token
        '403':
          description: Forbidden - Not the patient's prescription
        '404':
          description: Prescription not found

  /pharmacy/prescriptions/patient/prescriptions/{prescriptionId}/assign-pharmacy:
    post:
      summary: Assign pharmacy to prescription
      description: |
        Allows a patient to assign a pharmacy to fulfill their prescription.
        - Verifies the pharmacy is active and the prescription is in a valid state (PENDING or PATIENT_UPLOADED).
        - Updates the prescription with pharmacy and delivery details.
      tags: [Prescription]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: prescriptionId
          required: true
          schema:
            type: string
            format: uuid
          description: ID of the prescription
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignPharmacyRequest'
      responses:
        '200':
          description: Pharmacy assigned successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrescriptionResponse'
        '401':
          description: Unauthorized - Invalid or missing token
        '403':
          description: Forbidden - Not the patient's prescription
        '404':
          description: Prescription or pharmacy not found

  /pharmacy/prescriptions/patient/prescriptions:
    get:
      summary: Get patient's prescriptions
      description: |
        Retrieves a list of prescriptions for the authenticated patient.
        - Supports pagination and filtering via query parameters.
      tags: [Prescription]
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
          description: Page number for pagination
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
          description: Number of prescriptions per page
      responses:
        '200':
          description: List of patient's prescriptions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PrescriptionResponse'
        '401':
          description: Unauthorized - Invalid or missing token
        '403':
          description: Forbidden - Not a patient

  /pharmacy/prescriptions/pharmacy/prescriptions/{prescriptionId}/start-processing:
    post:
      summary: Start processing prescription
      description: |
        Allows a pharmacy to start processing an assigned prescription.
        - Verifies the prescription is assigned to the pharmacy and in PHARMACY_ASSIGNED status.
        - Assigns a pharmacist and updates status to PHARMACY_PROCESSING.
      tags: [Prescription]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: prescriptionId
          required: true
          schema:
            type: string
            format: uuid
          description: ID of the prescription
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartProcessingRequest'
      responses:
        '200':
          description: Prescription processing started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrescriptionResponse'
        '401':
          description: Unauthorized - Invalid or missing token
        '403':
          description: Forbidden - Not assigned to this pharmacy
        '404':
          description: Prescription or pharmacist not found

  /pharmacy/prescriptions/pharmacy/prescriptions/{prescriptionId}/provide-costs:
    post:
      summary: Provide medication costs
      description: |
        Allows a pharmacy to provide cost details and invoice for a prescription.
        - Calculates total cost including delivery fee and updates payment information.
      tags: [Prescription]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: prescriptionId
          required: true
          schema:
            type: string
            format: uuid
          description: ID of the prescription
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProvideCostsRequest'
      responses:
        '200':
          description: Costs provided successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrescriptionResponse'
        '401':
          description: Unauthorized - Invalid or missing token
        '403':
          description: Forbidden - Not assigned to this pharmacy
        '404':
          description: Prescription not found

  /pharmacy/prescriptions/pharmacy/prescriptions/{prescriptionId}/mark-ready:
    post:
      summary: Mark prescription as ready
      description: |
        Allows a pharmacy to mark a prescription as ready for delivery or pickup.
        - Updates status to `out_for_delivery` (delivery) or `ready_for_pickup` (pickup).
        - `readyType` must be `"delivery"` or `"pickup"`.
      tags: [Prescription]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: prescriptionId
          required: true
          schema:
            type: string
            format: uuid
          description: ID of the prescription
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MarkReadyRequest'
      responses:
        '200':
          description: Prescription marked as ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrescriptionResponse'
        '401':
          description: Unauthorized - Invalid or missing token
        '403':
          description: Forbidden - Not assigned to this pharmacy
        '404':
          description: Prescription not found

  /pharmacy/prescriptions/pharmacy/prescriptions/{prescriptionId}/complete:
    post:
      summary: Complete prescription fulfillment
      description: |
        Allows a pharmacy to mark a prescription as completed.
        - Updates status to COMPLETED and sets payment status to PAID.
      tags: [Prescription]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: prescriptionId
          required: true
          schema:
            type: string
            format: uuid
          description: ID of the prescription
      responses:
        '200':
          description: Prescription completed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrescriptionResponse'
        '401':
          description: Unauthorized - Invalid or missing token
        '403':
          description: Forbidden - Not assigned to this pharmacy
        '404':
          description: Prescription not found

  /pharmacy/prescriptions/pharmacy/orders:
    get:
      summary: Get active pharmacy orders
      description: |
        Retrieves active orders currently being processed by the authenticated pharmacy.
        - Returns prescriptions in `pharmacy_processing`, `ready_for_delivery`, or `ready_for_pickup` status.
        - Supports pagination via query parameters.
      tags: [Pharmacy Dashboard]
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
          description: Page number for pagination
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
          description: Number of orders per page
      responses:
        '200':
          description: List of active pharmacy orders
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PharmacyOrdersResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden - Not a pharmacy

  /pharmacy/prescriptions/pharmacy/contacts:
    get:
      summary: Get pharmacy contacts
      description: |
        Retrieves all unique patients and doctors who have interacted with the authenticated pharmacy via prescriptions.
        - Returns deduplicated lists of patients and doctors.
        - Useful for building contact/communication lists within the pharmacy portal.
      tags: [Pharmacy Dashboard]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Unique contacts associated with the pharmacy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PharmacyContactsResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden - Not a pharmacy

  /pharmacy/prescriptions/patient/invoices:
    get:
      summary: Get patient invoices
      description: |
        Retrieves all prescriptions with invoice data for the authenticated patient.
        - Only returns prescriptions where cost information has been provided (`totalDue IS NOT NULL`).
        - Supports pagination via query parameters.
      tags: [Prescription]
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
          description: Page number for pagination
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
          description: Number of invoices per page
      responses:
        '200':
          description: List of patient invoices
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PatientInvoicesResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden - Not a patient

  /pharmacy/prescriptions/pharmacy/prescriptions:
    get:
      summary: Get pharmacy's prescriptions
      description: |
        Retrieves a list of prescriptions assigned to the authenticated pharmacy.
        - Supports pagination and filtering via query parameters.
      tags: [Prescription]
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
          description: Page number for pagination
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
          description: Number of prescriptions per page
      responses:
        '200':
          description: List of pharmacy's prescriptions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PrescriptionResponse'
        '401':
          description: Unauthorized - Invalid or missing token
        '403':
          description: Forbidden - Not a pharmacy

  /pharmacy/prescriptions/pharmacy/dashboard/stats:
    get:
      summary: Get pharmacy dashboard statistics
      description: |
        Retrieves real-time counts for the pharmacy dashboard:
        - Pending requests
        - Active orders
        - Completed today
      tags: [Pharmacy Dashboard]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Dashboard statistics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardStatsResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden - Not a pharmacy

  /pharmacy/prescriptions/pharmacy/dashboard/activity:
    get:
      summary: Get pharmacy activity feed
      description: Retrieves a feed of recent status changes and actions for assigned prescriptions.
      tags: [Pharmacy Dashboard]
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: limit
          schema:
            type: integer
            default: 10
          description: Number of activity items to retrieve
      responses:
        '200':
          description: Activity feed items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ActivityFeedItem'

  /pharmacy/prescriptions/pharmacy/prescriptions/{prescriptionId}/confirm-availability:
    post:
      summary: Confirm medication availability
      description: Marks a prescription as having confirmed medication stock.
      tags: [Prescription Operations]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: prescriptionId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Availability confirmed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrescriptionResponse'

  /pharmacy/prescriptions/pharmacy/prescriptions/{prescriptionId}/internal-notes:
    post:
      summary: Add internal pharmacy note
      description: Allows pharmacy staff to add private notes to a prescription.
      tags: [Prescription Operations]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: prescriptionId
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InternalNoteRequest'
      responses:
        '201':
          description: Internal note added
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrescriptionResponse'

  /pharmacy/prescriptions/pharmacy/prescriptions/{prescriptionId}/propose-alternative:
    post:
      summary: Propose alternative medications
      description: |
        Allows a pharmacy to suggest alternative medications when the prescribed ones are unavailable.
        - Updates `availabilityStatus` to `alternatives_proposed`.
        - Stores the alternatives in `internalNotes`.
        - Sends a WebSocket notification and email to the patient immediately.
      tags: [Prescription Operations]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: prescriptionId
          required: true
          schema:
            type: string
            format: uuid
          description: ID of the prescription
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - alternatives
              properties:
                alternatives:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required:
                      - name
                    properties:
                      name:
                        type: string
                        example: Amoxicillin 500mg
                      dosage:
                        type: string
                        example: 500mg
                      reason:
                        type: string
                        example: Original brand not in stock
                pharmacistId:
                  type: string
                  format: uuid
                  description: Optional ID of the pharmacist proposing the alternatives
      responses:
        '200':
          description: Alternatives proposed — patient notified via WebSocket and email
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrescriptionResponse'
        '400':
          description: No alternatives provided
        '401':
          description: Unauthorized
        '403':
          description: Forbidden — Not assigned to this pharmacy
        '404':
          description: Prescription not found

  /pharmacy/prescriptions/{prescriptionId}/cancel:
    post:
      summary: Cancel a prescription
      description: |
        Allows a doctor, patient, or pharmacy to cancel a prescription.
        - Requires a cancellation reason.
        - Cannot cancel a completed prescription.
      tags: [Prescription]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: prescriptionId
          required: true
          schema:
            type: string
            format: uuid
          description: ID of the prescription
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelPrescriptionRequest'
      responses:
        '200':
          description: Prescription cancelled successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrescriptionResponse'
        '401':
          description: Unauthorized - Invalid or missing token
        '403':
          description: Forbidden - User not authorized to cancel
        '404':
          description: Prescription not found

  /pharmacy/prescriptions/{prescriptionId}/chat:
    post:
      summary: Add chat message
      description: |
        Allows a patient or pharmacy to add a chat message related to a prescription.
        - Verifies the sender's access to the prescription.
      tags: [Prescription]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: prescriptionId
          required: true
          schema:
            type: string
            format: uuid
          description: ID of the prescription
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatMessageRequest'
      responses:
        '200':
          description: Chat message added successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrescriptionResponse'
        '401':
          description: Unauthorized - Invalid or missing token
        '403':
          description: Forbidden - User not authorized to chat
        '404':
          description: Prescription not found

  /pharmacy/prescriptions/{prescriptionId}:
    get:
      summary: Get prescription by ID
      description: |
        Retrieves a specific prescription by its ID with all related details.
        - Accessible by doctors, patients, or pharmacies associated with the prescription.
      tags: [Prescription]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: prescriptionId
          required: true
          schema:
            type: string
            format: uuid
          description: ID of the prescription
      responses:
        '200':
          description: Prescription details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrescriptionResponse'
        '401':
          description: Unauthorized - Invalid or missing token
        '403':
          description: Forbidden - User not authorized
        '404':
          description: Prescription not found

  /pharmacy/prescriptions/search:
    get:
      summary: Search prescriptions
      description: |
        Searches for prescriptions based on query parameters.
        - Accessible by doctors, patients, or pharmacies.
        - Supports filtering by various criteria (e.g., status, date).
      tags: [Prescription]
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: query
          schema:
            type: string
          description: Search query string
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
          description: Page number for pagination
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
          description: Number of prescriptions per page
      responses:
        '200':
          description: List of matching prescriptions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PrescriptionResponse'
        '401':
          description: Unauthorized - Invalid or missing token
        '403':
          description: Forbidden - User not authorized

  # ── Alternative medication flow ─────────────────────────────────────────────

  /pharmacy/prescriptions/{prescriptionId}/approve-alternative:
    post:
      summary: Approve alternative medications
      description: |
        Doctor or patient approves the pharmacy's proposed alternative medications.
        - Prescription `availabilityStatus` moves from `alternatives_proposed` → `confirmed`.
        - Pharmacy is notified via WebSocket (`alternative_approved`) and push notification.
        - Returns 422 if no proposal is pending.
      tags: [Prescription Operations]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: prescriptionId
          required: true
          schema:
            type: string
            format: uuid
          description: ID of the prescription
      responses:
        '200':
          description: Alternatives approved — pharmacy notified
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrescriptionResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden — only the patient or the prescribing doctor can approve
        '404':
          description: Prescription not found
        '422':
          description: No pending alternative proposal to approve

  /pharmacy/prescriptions/{prescriptionId}/reject-alternative:
    post:
      summary: Reject alternative medications
      description: |
        Doctor or patient rejects the pharmacy's proposed alternative medications.
        - Prescription `availabilityStatus` moves from `alternatives_proposed` → `pending`.
        - Pharmacy is notified via WebSocket (`alternative_rejected`) and push notification.
        - Returns 422 if no proposal is pending.
      tags: [Prescription Operations]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: prescriptionId
          required: true
          schema:
            type: string
            format: uuid
          description: ID of the prescription
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
                  example: Prefer the originally prescribed brand
      responses:
        '200':
          description: Alternatives rejected — pharmacy notified
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrescriptionResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden — only the patient or the prescribing doctor can reject
        '404':
          description: Prescription not found
        '422':
          description: No pending alternative proposal to reject

  # ── Dispatch & delivery flow ─────────────────────────────────────────────────

  /pharmacy/prescriptions/dispatch:
    get:
      summary: Get dispatch items
      description: |
        Returns a paginated list of prescriptions eligible for dispatch (pharmacy only).
        - Eligible statuses: `ready_for_pickup`, `out_for_delivery`, `completed`.
        - Filter by a single status using the `status` query param.
      tags: [Pharmacy Dashboard]
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: status
          schema:
            type: string
            enum: [ready_for_pickup, out_for_delivery, completed]
          description: Filter by dispatch status
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
            default: 1
          description: Page number
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
          description: Items per page
      responses:
        '200':
          description: Paginated dispatch items
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/DispatchItem'
                  total:
                    type: integer
                    example: 42
                  page:
                    type: integer
                    example: 1
                  limit:
                    type: integer
                    example: 20
        '401':
          description: Unauthorized
        '403':
          description: Forbidden — not a pharmacy

  /pharmacy/prescriptions/{prescriptionId}/dispatch:
    post:
      summary: Initiate dispatch
      description: |
        Transitions a prescription from `ready_for_pickup` → `out_for_delivery` and records `dispatchedAt`.
        - `dispatchedAt` is **immutable** — calling this again on the same prescription returns 409.
        - Patient is notified via WebSocket (`prescription_status_changed`) and push notification.
        - Optional: supply `estimatedDelivery` (ISO 8601) and `note`.
      tags: [Pharmacy Dashboard]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: prescriptionId
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                estimatedDelivery:
                  type: string
                  format: date-time
                  example: "2025-08-25T14:00:00Z"
                  description: Expected delivery timestamp (ISO 8601)
                note:
                  type: string
                  example: Dispatched via courier
      responses:
        '200':
          description: Prescription dispatched
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DispatchResult'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden — not assigned to this pharmacy
        '404':
          description: Prescription not found
        '409':
          description: Already dispatched — dispatchedAt is immutable
        '422':
          description: Prescription is not in ready_for_pickup status

  /pharmacy/prescriptions/{prescriptionId}/delivered:
    post:
      summary: Mark prescription as delivered
      description: |
        Transitions a prescription from `out_for_delivery` → `completed`.
        - Records `actualDeliveryDate`.
        - Notifies patient via WebSocket + push notification.
        - Notifies pharmacy dashboard via WebSocket (`prescription_status_changed`).
      tags: [Pharmacy Dashboard]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: prescriptionId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Prescription marked as delivered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DispatchResult'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden — not assigned to this pharmacy
        '404':
          description: Prescription not found
        '422':
          description: Prescription is not in out_for_delivery status

  /pharmacy/prescriptions/{prescriptionId}/status:
    patch:
      summary: Update prescription status (generic override)
      description: |
        Generic status override for pharmacy staff.
        - Accepts any valid `PrescriptionStatus` value.
        - Adds a fulfillment history entry.
        - Use specific action endpoints (start-processing, mark-ready, dispatch, etc.) where possible.
      tags: [Prescription Operations]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: prescriptionId
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum:
                    - pending
                    - patient_uploaded
                    - pharmacy_assigned
                    - pharmacy_processing
                    - under_review
                    - awaiting_payment
                    - in_progress
                    - ready_for_pickup
                    - out_for_delivery
                    - completed
                    - cancelled
                  example: in_progress
      responses:
        '200':
          description: Status updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrescriptionResponse'
        '400':
          description: Invalid status value
        '401':
          description: Unauthorized
        '403':
          description: Forbidden — not assigned to this pharmacy
        '404':
          description: Prescription not found