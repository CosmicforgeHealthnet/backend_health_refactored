# 6. src/docs/pharmacy/admin/pharmacyAdminComponents.yaml
components:
  schemas:
    PendingVerificationsResponse:
      type: object
      properties:
        verifications:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
              pharmacyId:
                type: string
                format: uuid
              pharmacyName:
                type: string
              registrationNumber:
                type: string
              requestType:
                type: string
              status:
                type: string
              priority:
                type: string
              submittedAt:
                type: string
                format: date-time
              assignedTo:
                type: string
                format: uuid

    AssignVerificationRequest:
      type: object
      properties:
        adminId:
          type: string
          format: uuid

    PharmacyReviewResponse:
      type: object
      properties:
        pharmacy:
          type: object
        documents:
          type: array
          items:
            type: object

    DocumentVerificationRequest:
      type: object
      required:
        - isVerified
      properties:
        isVerified:
          type: boolean
        notes:
          type: string

    ApprovalRequest:
      type: object
      properties:
        reviewNotes:
          type: string

    RejectionRequest:
      type: object
      required:
        - rejectionReason
      properties:
        rejectionReason:
          type: string

    PharmacyListItem:
      type: object
      properties:
        id:
          type: string
          format: uuid
        pharmacyName:
          type: string
        registrationNumber:
          type: string
        address:
          type: string
        phone:
          type: string
        email:
          type: string
        username:
          type: string
        verificationStatus:
          type: string
          enum: [pending, approved, rejected]
        isActive:
          type: boolean
        documentsSubmitted:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        user:
          type: object
          nullable: true
          properties:
            id:
              type: string
              format: uuid
            fullName:
              type: string
            email:
              type: string
            status:
              type: string
            createdAt:
              type: string
              format: date-time

    PharmacyListResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: array
          items:
            $ref: '#/components/schemas/PharmacyListItem'

    RequestDocumentsRequest:
      type: object
      required:
        - requiredDocuments
      properties:
        requiredDocuments:
          type: array
          items:
            type: string
          example: ["license", "tax_certificate"]

    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
        error:
          type: string