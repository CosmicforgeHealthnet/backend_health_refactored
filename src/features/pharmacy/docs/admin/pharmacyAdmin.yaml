# 5. src/docs/pharmacy/admin/pharmacyAdmin.yaml
paths:
  /pharmacy/list:
    get:
      summary: List all pharmacies
      description: Returns a paginated list of pharmacies. Accessible to any authenticated user (patients, doctors, etc.) to browse and select a pharmacy.
      tags: [PharmacyAdmin]
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: verificationStatus
          in: query
          schema:
            type: string
            enum: [pending, approved, rejected]
      responses:
        '200':
          description: List of pharmacies
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PharmacyListResponse'
        '401':
          description: Unauthorized

  /pharmacy/admin/pharmacies:
    get:
      summary: List all pharmacies (admin)
      description: Returns a paginated list of all pharmacies with full details. Admin access only.
      tags: [PharmacyAdmin]
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: verificationStatus
          in: query
          schema:
            type: string
            enum: [pending, approved, rejected]
      responses:
        '200':
          description: List of pharmacies
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PharmacyListResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden — admin role required

  /pharmacy/admin/verifications/pending:
    get:
      summary: Get pending pharmacy verifications
      tags: [PharmacyAdmin]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Pending verifications
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PendingVerificationsResponse'

  /pharmacy/admin/verifications/{verificationId}/assign:
    post:
      summary: Assign verification to admin
      tags: [PharmacyAdmin]
      security:
        - bearerAuth: []
      parameters:
        - name: verificationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignVerificationRequest'
      responses:
        '200':
          description: Verification assigned

  /pharmacy/admin/pharmacy/{pharmacyId}/review:
    get:
      summary: Review pharmacy details
      tags: [PharmacyAdmin]
      security:
        - bearerAuth: []
      parameters:
        - name: pharmacyId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Pharmacy review data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PharmacyReviewResponse'

  /pharmacy/admin/documents/{documentId}/verify:
    post:
      summary: Verify pharmacy document
      tags: [PharmacyAdmin]
      security:
        - bearerAuth: []
      parameters:
        - name: documentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DocumentVerificationRequest'
      responses:
        '200':
          description: Document verification updated

  /pharmacy/admin/pharmacy/{pharmacyId}/approve:
    post:
      summary: Approve pharmacy
      tags: [PharmacyAdmin]
      security:
        - bearerAuth: []
      parameters:
        - name: pharmacyId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApprovalRequest'
      responses:
        '200':
          description: Pharmacy approved

  /pharmacy/admin/pharmacy/{pharmacyId}/reject:
    post:
      summary: Reject pharmacy
      tags: [PharmacyAdmin]
      security:
        - bearerAuth: []
      parameters:
        - name: pharmacyId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RejectionRequest'
      responses:
        '200':
          description: Pharmacy rejected

  /pharmacy/admin/pharmacy/{pharmacyId}/request-documents:
    post:
      summary: Request additional documents from pharmacy
      description: Sends a request to the pharmacy to upload specific documents required for verification.
      tags: [PharmacyAdmin]
      security:
        - bearerAuth: []
      parameters:
        - name: pharmacyId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequestDocumentsRequest'
      responses:
        '200':
          description: Document request sent successfully
        '400':
          description: requiredDocuments must be a non-empty array
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Pharmacy not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'