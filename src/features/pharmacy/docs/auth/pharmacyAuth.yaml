# 1. src/docs/pharmacy/auth/pharmacyAuth.yaml
paths:
  /pharmacy/auth/register:
    post:
      summary: Register a new pharmacy
      description: |
        Creates a new pharmacy user account and associated pharmacy profile.
        - Sets user role to "pharmacy" and status to "pending_email_verification".
        - Creates a pharmacy profile with "pending" verification status.
        - Sends a verification email (non-blocking); response indicates if email was sent successfully.
        - After email verification, pharmacies must upload documents for admin approval.
      tags: [PharmacyAuth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PharmacySignUp'
      responses:
        '201':
          description: Pharmacy registration successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PharmacyRegistrationResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /pharmacy/auth/login:
    post:
      summary: Login pharmacy user
      tags: [PharmacyAuth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PharmacyLogin'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: Invalid credentials
        '403':
          description: Not a pharmacy account

  /pharmacy/auth/profile:
    get:
      summary: Get pharmacy profile
      tags: [PharmacyProfile]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Pharmacy profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PharmacyProfileResponse'
        '404':
          description: Profile not found
    put:
      summary: Update pharmacy profile
      tags: [PharmacyProfile]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePharmacyProfile'
      responses:
        '200':
          description: Profile updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PharmacyProfileResponse'

  /pharmacy/auth/pricing:
    get:
      summary: Get pharmacy pricing
      tags: [PharmacyPricing]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of pharmacy pricing
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PharmacyPricing'
    post:
      summary: Set pharmacy pricing
      tags: [PharmacyPricing]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PharmacyPricingRequest'
      responses:
        '201':
          description: Pricing set successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PharmacyPricing'

  /pharmacy/auth/staff:
    get:
      summary: Get pharmacy staff members
      tags: [PharmacyStaff]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of staff members
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StaffMember'
    post:
      summary: Add a new staff member
      tags: [PharmacyStaff]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StaffMemberRequest'
      responses:
        '201':
          description: Staff member added successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffMember'

  /pharmacy/auth/staff/{id}:
    delete:
      summary: Remove a staff member
      tags: [PharmacyStaff]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Staff member removed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
