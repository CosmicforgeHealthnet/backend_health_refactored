  /user/doctors/{doctorId}/unavailability:
    post:
      security:
        - BearerAuth: []
      tags:
        - User Management
      summary: Set doctor unavailability period
      parameters:
        - name: doctorId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - startDate
                - endDate
              properties:
                startDate:
                  type: string
                  format: date
                  example: "2025-06-20"
                endDate:
                  type: string
                  format: date
                  example: "2025-06-25"
                startTime:
                  type: string
                  pattern: '^([0-1]?[0-9]|2[0-3]):[0-5][0-9]$'
                  nullable: true
                  description: "If null, entire day is unavailable"
                endTime:
                  type: string
                  pattern: '^([0-1]?[0-9]|2[0-3]):[0-5][0-9]$'
                  nullable: true
                  description: "If null, entire day is unavailable"
                reason:
                  type: string
                  maxLength: 255
                  example: "Summer vacation"
                type:
                  type: string
                  enum: [vacation, sick, meeting, personal, other]
                  default: "other"
            examples:
              vacation_period:
                summary: Set vacation period
                value:
                  startDate: "2025-06-20"
                  endDate: "2025-06-25"
                  reason: "Summer vacation"
                  type: "vacation"
              partial_day_unavailable:
                summary: Set partial day unavailability
                value:
                  startDate: "2025-06-22"
                  endDate: "2025-06-22"
                  startTime: "14:00"
                  endTime: "16:00"
                  reason: "Medical conference"
                  type: "meeting"
      responses:
        '201':
          description: Unavailability period set successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  unavailability:
                    type: object
                  message:
                    type: string
                    example: "Unavailability period set successfully"
        '400':
          $ref: '#/components/responses/ValidationError'
 
