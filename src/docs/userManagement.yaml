
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier for the user
        fullName:
          type: string
          description: User's full name
        email:
          type: string
          description: User's email address
        role:
          type: string
          enum: [patient, doctor, pharmacy, lab, admin, super_admin]
          description: User's role in the system
        status:
          type: string
          enum: [pending_email_verification, active, pending_doctor_verification, doctor_active, locked]
          description: User's account status
        isOnline:
          type: boolean
          description: Whether the user is currently online
        profileImageUrl:
          type: string
          nullable: true
          description: URL to the user's profile image
        provider:
          type: string
          enum: [local, google]
          description: Authentication provider
        mfaEnabled:
          type: boolean
          description: Whether multi-factor authentication is enabled
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the user was created
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the user was last updated
      required:
        - id
        - fullName
        - email
        - role
        - status
        - isOnline
        - mfaEnabled
        - createdAt
        - updatedAt

    UpdateAuthRequest:
      type: object
      properties:
        fullName:
          type: string
          description: User's full name
        profileImageUrl:
          type: string
          nullable: true
          description: URL to the user's profile image
        bannerUrl:
          type: string
          nullable: true
          description: URL to the user's banner image
        departmentSpecialty:
          type: string
          nullable: true
          description: Medical specialty or department (for doctors)
      minProperties: 1
      example:
        fullName: "Dr. John Smith"
        profileImageUrl: "https://example.com/images/dr-smith.jpg"
        bannerUrl: "https://example.com/banner/dr-smith.jpg"
        departmentSpecialty: "paediatrician"

    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
          description: Indicates if the request was successful
        message:
          type: string
          description: Human-readable message about the operation
      required:
        - success
        - message

  responses:
    UnauthorizedError:
      description: Authentication required or token invalid
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
                example: false
              error:
                type: string
                example: "Authentication required or token invalid"
              code:
                type: string
                example: "UNAUTHORIZED"

    BadRequestError:
      description: Invalid request data
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
                example: false
              error:
                type: string
                example: "Invalid request data"
              code:
                type: string
                example: "BAD_REQUEST"

    InternalServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
                example: false
              error:
                type: string
                example: "Internal server error"
              code:
                type: string
                example: "INTERNAL_ERROR"

paths:
  /user/doctors:
    get:
      security:
        - BearerAuth: []
      tags:
        - User Management
      summary: Retrieve all doctors
      description: Fetches a list of all users with the doctor role.
      responses:
        '200':
          description: Successfully retrieved list of doctors
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/User'
                  message:
                    type: string
              example:
                success: true
                data:
                  - id: "user123"
                    fullName: "Dr. Johnson"
                    email: "dr.johnson@hospital.com"
                    role: "doctor"
                    status: "doctor_active"
                    isOnline: true
                    profileImageUrl: "https://example.com/images/dr-johnson.jpg"
                    provider: "local"
                    mfaEnabled: false
                    createdAt: "2025-06-14T10:00:00Z"
                    updatedAt: "2025-06-14T10:00:00Z"
                message: "Doctors retrieved successfully"
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '500':
          $ref: '#/components/responses/InternalServerError'

