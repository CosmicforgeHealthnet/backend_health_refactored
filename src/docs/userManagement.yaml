  /user/rating:
    put:
      security:
        - BearerAuth: []
      tags:
        - User Management
      summary: Add or update a rating for a user
      description: Submit a new rating (1–5) for a specific user. The API will recalculate the average automatically.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                userId:
                  type: string
                  description: ID of the user to rate
                rating:
                  type: number
                  format: float
                  minimum: 1
                  maximum: 5
                message:
                  type: string
                  description: "message to users"
              required:
                - userId
                - rating
            example:
              userId: "cbe928f3-71e1-4d6a-89f0-3dcfd99ef02f"
              rating: 4.5
              message: "Great experience!"
      responses:
        '200':
          description: Rating added successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  averageRating:
                    type: number
                    format: float
                  totalRatings:
                    type: integer
              example:
                message: Rating added successfully
                averageRating: 4.3
                totalRatings: 10
  
  /user/rating/{userId}:
    get:
      security:
        - BearerAuth: []
      tags:
        - User Management
      summary: Get a user's ratings summary
      description: >
        Fetches the average rating, total ratings, and optionally the last
        messages for the user.
