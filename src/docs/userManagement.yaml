  /user/doctors/{doctorId}/pricing:
    post:
      security:
        - BearerAuth: []
      tags:
        - User Management
      summary: Set doctor pricing for consultation types
      parameters:
        - name: doctorId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - consultationType
                - price
              properties:
                consultationType:
                  type: string
                  enum: [consultation, follow-up, routine-checkup, urgent]
                price:
                  type: number
                  multipleOf: 0.01
                  minimum: 0
                currency:
                  type: string
                  enum: [NGN, USD, EUR, GBP]
                  default: "NGN"
                duration:
                  type: integer
                  minimum: 15
                  maximum: 240
                  default: 30
            examples:
              consultation_pricing:
                summary: Set consultation pricing
                value:
                  consultationType: "consultation"
                  price: 150.00
                  currency: "NGN"
                  duration: 30
      responses:
        '201':
          description: Pricing set successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  pricing:
                    type: object
                  message:
                    type: string
                    example: "Pricing set successfully"
        '400':
          $ref: '#/components/responses/ValidationError'

    get:
      security:
        - BearerAuth: []
      tags:
        - User Management
      summary: Get doctor pricing for all consultation types
      parameters:
        - name: doctorId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Doctor pricing retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  pricing:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          format: uuid
                        consultationType:
                          type: string
                        price:
                          type: number
                        currency:
                          type: string
                        duration:
                          type: integer
                        isActive:
                          type: boolean

  /user/doctors/{doctorId}/pricing/{pricingId}:
    put:
      security:
        - BearerAuth: []
      tags:
        - User Management
      summary: Update doctor pricing
      parameters:
        - name: doctorId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: pricingId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                price:
                  type: number
                  multipleOf: 0.01
                currency:
                  type: string
                  enum: [NGN, USD, EUR, GBP]
                duration:
                  type: integer
                  minimum: 15
                  maximum: 240
      responses:
        '200':
          description: Pricing updated successfully
        '400':
          $ref: '#/components/responses/ValidationError'

    delete:
      security:
        - BearerAuth: []
      tags:
        - User Management
      summary: Delete doctor pricing
      parameters:
        - name: doctorId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: pricingId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Pricing deleted successfully

  /user/doctors/{doctorId}/availability:
    post:
      security:
        - BearerAuth: []
      tags:
        - User Management
      summary: Set doctor weekly availability
      parameters:
        - name: doctorId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                type: object
                required:
                  - dayOfWeek
                  - startTime
                  - endTime
                properties:
                  dayOfWeek:
                    type: string
                    enum: [monday, tuesday, wednesday, thursday, friday, saturday, sunday]
                  startTime:
                    type: string
                    pattern: '^([0-1]?[0-9]|2[0-3]):[0-5][0-9]$'
                    example: "09:00"
                  endTime:
                    type: string
                    pattern: '^([0-1]?[0-9]|2[0-3]):[0-5][0-9]$'
                    example: "17:00"
                  slotDuration:
                    type: integer
                    minimum: 15
                    maximum: 120
                    default: 30
                  breakTime:
                    type: integer
                    minimum: 0
                    maximum: 60
                    default: 0
                  maxAppointments:
                    type: integer
                    minimum: 1
                    nullable: true
                  timezone:
                    type: string
                    default: "UTC"
            examples:
              weekly_schedule:
                summary: Set weekly availability
                value:
                  - dayOfWeek: "monday"
                    startTime: "09:00"
                    endTime: "17:00"
                    slotDuration: 30
                    breakTime: 5
                    maxAppointments: 16
                  - dayOfWeek: "tuesday"
                    startTime: "09:00"
                    endTime: "17:00"
                    slotDuration: 30
                    breakTime: 0
      responses:
        '201':
          description: Availability set successfully
        '400':
          $ref: '#/components/responses/ValidationError'
    
    put:
      security:
        - BearerAuth: []
      tags:
        - User Management
      summary: Replace doctor weekly availability
      description: |
        Replace existing availability schedule for specified days.
        This will delete existing availability for the specified days and create new ones.
        Prevents duplicate days in the same request.
      parameters:
        - name: doctorId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                type: object
                required:
                  - dayOfWeek
                  - startTime
                  - endTime
                properties:
                  dayOfWeek:
                    type: string
                    enum: [monday, tuesday, wednesday, thursday, friday, saturday, sunday]
                  startTime:
                    type: string
                    pattern: '^([0-1]?[0-9]|2[0-3]):[0-5][0-9]$'
                    example: "09:00"
                  endTime:
                    type: string
                    pattern: '^([0-1]?[0-9]|2[0-3]):[0-5][0-9]$'
                    example: "17:00"
                  slotDuration:
                    type: integer
                    minimum: 15
                    maximum: 120
                    default: 30
                  breakTime:
                    type: integer
                    minimum: 0
                    maximum: 60
                    default: 0
                  maxAppointments:
                    type: integer
                    minimum: 1
                    nullable: true
                  timezone:
                    type: string
                    default: "UTC"
            examples:
              replace_weekdays:
                summary: Replace weekday schedule
                value:
                  - dayOfWeek: "monday"
                    startTime: "08:00"
                    endTime: "18:00"
                    slotDuration: 30
                    breakTime: 5
                    maxAppointments: 20
                  - dayOfWeek: "tuesday"
                    startTime: "09:00"
                    endTime: "17:00"
                    slotDuration: 45
                    breakTime: 10
                  - dayOfWeek: "wednesday"
                    startTime: "08:00"
                    endTime: "16:00"
                    slotDuration: 30
                    breakTime: 0
                    maxAppointments: 16
              replace_weekend:
                summary: Replace weekend schedule
                value:
                  - dayOfWeek: "saturday"
                    startTime: "10:00"
                    endTime: "14:00"
                    slotDuration: 60
                    breakTime: 15
                    maxAppointments: 4
                  - dayOfWeek: "sunday"
                    startTime: "09:00"
                    endTime: "13:00"
                    slotDuration: 30
                    breakTime: 0
                    maxAppointments: 8
      responses:
        '200':
          description: Availability replaced successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  availability:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          format: uuid
                        doctorId:
                          type: string
                          format: uuid
                        dayOfWeek:
                          type: string
                          example: "monday"
                        startTime:
                          type: string
                          example: "08:00"
                        endTime:
                          type: string
                          example: "18:00"
                        slotDuration:
                          type: integer
                          example: 30
                        breakTime:
                          type: integer
                          example: 5
                        maxAppointments:
                          type: integer
                          example: 20
                        isAvailable:
                          type: boolean
                          example: true
                        timezone:
                          type: string
                          example: "UTC"
                        createdAt:
                          type: string
                          format: date-time
                        updatedAt:
                          type: string
                          format: date-time
                  message:
                    type: string
                    example: "Availability replaced successfully"
        '400':
          description: Bad request - validation errors
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  error:
                    type: string
              examples:
                duplicate_days:
                  summary: Duplicate days in request
                  value:
                    success: false
                    error: "Duplicate days found in request: monday, tuesday"
                invalid_time:
                  summary: Invalid time format
                  value:
                    success: false
                    error: "Invalid time format. Use HH:MM format (24-hour)"
                time_conflict:
                  summary: Start time after end time
                  value:
                    success: false
                    error: "Start time must be before end time"
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'

    get:
      security:
        - BearerAuth: []
      tags:
        - User Management
      summary: Get doctor availability schedule
      parameters:
        - name: doctorId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Doctor availability retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  availability:
                    type: array
                    items:
                      type: object
                      properties:
