                    type: boolean
                    example: true
                  date:
                    type: string
                    format: date
                  doctorId:
                    type: string
                    format: uuid
                  availableSlots:
                    type: array
                    items:
                      type: string
                    example: ["09:00", "09:35", "10:10", "10:45", "15:00", "15:35"]
