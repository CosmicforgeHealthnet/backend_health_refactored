    # File schemas
    FileUploadRequest:
      type: object
      required:
        - uploadBy
        - fileUrl
        - fileName
        - folderName
        - fileId
      properties:
        uploadBy:
          type: string
          format: uuid
          description: User ID of the uploader
        fileUrl:
          type: string
          format: uri
        fileName:
          type: string
        folderName:
          type: string
        fileId:
          type: string
          description: Provider's file‐identifier
        timestamp:
          type: string
          format: date-time
          description: When the file was uploaded; defaults to now

    FileUpdateRequest:
      type: object
      properties:
        fileName:
          type: string
        folderName:
          type: string

    FileRecord:
      type: object
      properties:
        id:
          type: string
          format: uuid
        uploadBy:
          type: string
          format: uuid
        fileUrl:
          type: string
          format: uri
        fileName:
          type: string
        folderName:
          type: string
        fileId:
          type: string
        timestamp:
          type: string
          format: date-time

    FileListResponse:
      type: object
      properties:
        files:
          type: array
          items:
            $ref: '#/components/schemas/FileRecord'
        total:
          type: integer

  parameters:
    FileId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: UUID of the file record

    UploadBy:
      name: uploadBy
      in: query
      required: false
      schema:
        type: string
        format: uuid
      description: Filter files by uploader user ID

    MagicLoginToken:
      name: token
      in: query
      required: true
      schema:
        type: string
      description: The one-time magic link token

    MagicLoginFingerprint:
      name: deviceFingerprint
      in: query
      required: true
      schema:
        type: string
      description: Client-generated fingerprint to bind the refresh token

    GoogleCallbackFingerprint:
      name: deviceFingerprint
      in: query
      required: true
      schema:
        type: string
      description: Client-generated fingerprint to bind the refresh token

    GoogleAuthRole:
      name: role
      in: query
      required: false
      schema:
        type: string
        enum:
          - patient
          - doctor
          - pharmacy
          - lab
        default: patient
      description: |
        Desired user role for new Google sign-ups.
        This value is passed through the OAuth state parameter
        and determines which type of user account will be created
        on first-time signup.

    PatientProfileId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: The UUID of the patient profile

    UserId:
      name: userId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: The UUID of the associated user

    DoctorProfileId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: The UUID of the doctor profile

    VerificationRequestId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: UUID of the verification request

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  responses:
    BadRequest:
      description: Invalid input
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    Unauthorized:
      description: Authentication required
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    Forbidden:
      description: Access denied
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'