events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    client_max_body_size 100M;

    # Logging
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/json;

    upstream node_backend {
        server cosmic_backend_dev:5000;
    }

    upstream ai_brain {
        server cosmic_brain_dev:8001;
    }

    server {
        listen 80;
        server_name dev.cosmicforge-healthnet.com;

        # Static files (images uploaded by backend)
        location /images/ {
            alias /app/uploads/images/;
            try_files $uri $uri/ =404;
            expires 1y;
            access_log off;
            add_header Cache-Control "public, immutable";
            add_header X-Environment "development";
        }

        # Health check endpoint
        location /health {
            proxy_pass http://node_backend/health;
            access_log off;
        }

        # AI Service Documentation (FastAPI Swagger)
        # Accessible via http://dev.cosmicforge-healthnet.com/ai/docs
        location /ai/ {
            rewrite ^/ai/(.*) /$1 break;
            proxy_pass http://ai_brain;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Main Node.js Backend & API
        location / {
            proxy_pass http://node_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
            proxy_read_timeout 300s;
            proxy_connect_timeout 75s;
        }
    }
}