services:
  # 1. The Body (Node.js Backend)
  backend:
    build: .
    container_name: cosmic_backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    volumes:
      - ./uploads:/app/uploads
    environment:
      - NODE_ENV=production
      - PORT=5000
      - UPLOAD_DIRECTORY=/app/uploads
      - AI_SERVICE_URL=http://ai_service:8001/api/v1
      - REDIS_URL=redis://redis:6379
      - REDIS_DEV_HOST=redis
      - FILE_SERVER_URL=https://api.cosmicforge-healthnet.com
      - URL_SIGNING_SECRET=570396e1d4000a1ee59ea8903ff3b8b491a202d441b068ca132a5ae035fe1013
    env_file:
      - .env.production
    depends_on:
      - ai_service
      - redis
    networks:
      - cosmic_network
      - shared_network

  # 2. The Brain (Python AI Service)
  ai_service:
    build: ./ai_service
    container_name: cosmic_brain
    restart: unless-stopped
    ports:
      - "8001:8001"
    volumes:
      - ./ai_service:/app
    networks:
      - cosmic_network

  # 3. The Memory (Redis)
  redis:
    image: redis:alpine
    container_name: cosmic_redis
    restart: unless-stopped
    networks:
      - cosmic_network

networks:
  cosmic_network:
    driver: bridge
  shared_network:
    external: true
    name: refactored_backend_healthcare-network
