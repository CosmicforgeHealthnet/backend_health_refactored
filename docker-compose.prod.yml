version: '3.8'

services:
  backend:
    image: cosmicforge/cosmicforge-backend:latest
    container_name: cosmic_backend_prod
    restart: unless-stopped
    ports:
      - "5000:5000"
    volumes:
      - ./uploads:/app/uploads
    environment:
      - NODE_ENV=production
      - PORT=5000
      - UPLOAD_DIRECTORY=/app/uploads
      - AI_SERVICE_URL=http://cosmic_brain_prod:8001/api/v1
      - REDIS_URL=redis://redis:6379
      - REDIS_DEV_HOST=redis
      - FILE_SERVER_URL=https://api.cosmicforge-healthnet.com
    env_file:
      - .env
    depends_on:
      - ai_service
      - redis
    networks:
      - cosmic_network_prod
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  ai_service:
    image: cosmicforge/cosmicforge-ai:latest
    container_name: cosmic_brain_prod
    restart: unless-stopped
    ports:
      - "8001:8001"
    networks:
      - cosmic_network_prod
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8001/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  redis:
    image: redis:alpine
    container_name: cosmic_redis_prod
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - cosmic_network_prod
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  nginx:
    image: nginx:alpine
    container_name: cosmic_gateway_prod
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deployment/nginx.production.conf:/etc/nginx/nginx.conf:ro
      - ./uploads:/app/uploads:ro  # Mount uploads for static file serving
      - /etc/letsencrypt:/etc/letsencrypt:ro  # SSL certificates
      - /var/www/certbot:/var/www/certbot:ro  # Let's Encrypt verification
    depends_on:
      - backend
      - ai_service
    networks:
      - cosmic_network_prod

networks:
  cosmic_network_prod:
    driver: bridge