services:
  # 1. The Body (Node.js Backend)
  backend:
    build: .
    container_name: cosmic_backend
    ports:
      - "5000:5000"
    volumes:
      - /opt/render/project/uploads:/opt/render/project/uploads
    environment:
      - NODE_ENV=production
      - PORT=5000
      - AI_SERVICE_URL=http://ai_service:8001/api/v1
      - REDIS_URL=redis://redis:6379
      # Add other DB credentials here or use .env file
    env_file:
      - .env.production
    depends_on:
      - ai_service
      - redis
    networks:
      - cosmic_network

  # 2. The Brain (Python AI Service)
  ai_service:
    build: ./ai_service
    container_name: cosmic_brain
    ports:
      - "8001:8001"
    volumes:
      - ./ai_service:/app
    networks:
      - cosmic_network

  # 4. The Memory (Redis)
  redis:
    image: redis:alpine
    container_name: cosmic_redis
    # ports:
    #   - "6379:6379"  <-- Host port disabled to avoid conflict
    networks:
      - cosmic_network

  # 3. The Gateway (Nginx)
  nginx:
    image: nginx:alpine
    container_name: cosmic_gateway
    ports:
      - "8080:80"
    volumes:
      - ./deployment/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - ai_service
    networks:
      - cosmic_network

networks:
  cosmic_network:
    driver: bridge
